<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0a16">
<title>🍉 合成大西瓜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; width: 100%;
    overflow: hidden;
    background: #0d0a16;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    overscroll-behavior: none;
    position: fixed; inset: 0;
  }
  #container {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
  }
  canvas {
    display: block; touch-action: none;
    /* sized dynamically by JS */
    /* 视野已按比例封顶，高屏会留出上下余量 —— 用圆角+外发光把余量做成「机台边框」观感 */
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06);
  }
  /* ===== HUD ===== */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 8px) + 6px) 16px 0 16px;
    display: flex; align-items: center; justify-content: center; gap: 18px;
    pointer-events: none; z-index: 10;
    font-family: "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  #hud .item {
    font-size: 13px; color: #9a92b8;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  #hud .item b {
    color: #ffe08a; font-weight: 800; font-size: 16px;
    font-variant-numeric: tabular-nums;
  }
  #hud .next-wrap {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 20px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
    font-size: 12px; color: #9a92b8;
  }
  #hud .next-wrap .emoji { font-size: 20px; line-height: 1; }
  /* ===== 阶段K · HUD 脉冲 ===== */
  #score.pulse, #coinCount.pulse {
    animation: hudPulseK .32s ease-out;
    text-shadow: 0 0 12px rgba(255,215,80,0.75);
  }
  @keyframes hudPulseK {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  #score, #coinCount { display: inline-block; transform-origin: center; }
  /* Sound toggle */
  #soundBtn {
    position: fixed; top: calc(env(safe-area-inset-top, 8px) + 6px); right: 16px;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
    color: #e8e2f4; font-size: 18px; line-height: 36px; text-align: center;
    cursor: pointer; z-index: 20; pointer-events: auto;
    transition: background 0.2s;
  }
  #soundBtn:active { background: rgba(255,255,255,0.16); }
  /* ===== Splash ===== */
  #splash {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(130% 100% at 50% -10%, #2a2140 0%, #191426 45%, #0d0a16 100%);
    display: grid; place-items: center;
    font-family: "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    transition: opacity 0.35s ease;
  }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash .splash-inner {
    text-align: center;
    padding: 0 24px;
    width: 100%;
    max-width: 420px;
    box-sizing: border-box;
  }
  #splash .logo {
    font-size: min(22vw, 92px);
    line-height: 1;
    margin-bottom: 10px;
    filter: drop-shadow(0 6px 18px rgba(0,0,0,0.5));
  }
  #splash h1 {
    /* 纯文字，不含 emoji —— 避免各平台 emoji 字宽差异把标题挤出屏幕 */
    font-size: min(9.5vw, 40px);
    letter-spacing: 2px; font-weight: 900;
    line-height: 1.2;
    white-space: nowrap;
    background: linear-gradient(90deg,#ff9f6b,#ffd86b,#7bffa8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
    margin-bottom: 12px;
  }
  #splash .sub { font-size: 14px; color: #9a92b8; margin: 0 0 30px 0; }
  #splash .tap {
    font-size: 16px; color: #ffe08a;
    animation: breathe 1.8s ease-in-out infinite;
    margin: 0;
  }
  @keyframes breathe { 0%,100%{opacity:0.6;transform:scale(1)} 50%{opacity:1;transform:scale(1.05)} }
  #splash .best-line { font-size: 13px; color: #6a6386; margin: 12px 0 0 0; }
  /* ===== Game-over overlay ===== */
  #overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(13, 10, 22, 0.80);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    opacity: 1; transition: opacity 0.25s ease;
    padding: env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
    font-family: "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  #overlay.hidden { display: none; }
  .panel {
    background: linear-gradient(160deg,#241d38,#181225);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 26px 36px; text-align: center;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    animation: pop 0.35s cubic-bezier(0.34,1.56,0.64,1);
    max-width: 320px; width: 85vw;
  }
  @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .panel h2 { font-size: 22px; margin-bottom: 12px; color: #ff8fa8; letter-spacing: 2px; }
  .panel p { font-size: 14px; margin: 6px 0; color: #9a92b8; }
  .panel p b { color: #ffe08a; font-size: 17px; font-variant-numeric: tabular-nums; }
  .panel .newrec { color: #7bffa8; font-weight: 800; font-size: 14px; margin-top: 8px; letter-spacing: 1px; }
  .panel button {
    margin-top: 16px; padding: 12px 36px; font-size: 15px; font-weight: 800;
    border: none; border-radius: 999px; letter-spacing: 2px;
    background: linear-gradient(135deg,#ff9f6b,#ffcf5b);
    color: #2a1608; cursor: pointer;
    box-shadow: 0 6px 18px rgba(255,160,90,0.35);
    transition: transform 0.1s ease;
  }
  .panel button:active { transform: scale(0.95); }
  /* 结算页：可变内容进滚动区，底部的「皮肤/商店」固定常显（不再被裁掉） */
  .panel {
    max-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 32px);
    display: flex; flex-direction: column;
    overflow: hidden;
    margin-bottom: 40px;   /* 居中容器里加下边距 → 整体略微上移 */
  }
  .panel-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .panel-foot.menuRow {
    margin-top: 12px; padding-top: 12px;
    border-top: 1px dashed rgba(255,255,255,0.12);
  }
  /* 结算页菜单行里的「皮肤/商店」：还原紧凑药丸样式，并强制横向一行排列 */
  .panel .menuRow { flex-wrap: nowrap; }
  .panel .menuBtn {
    margin-top: 0; padding: 8px 14px;
    display: inline-flex; align-items: center; gap: 5px;
    border-radius: 999px; letter-spacing: 0.5px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.13);
    color: #cfc8e4; font-size: 13px; font-weight: 700;
    cursor: pointer; box-shadow: none;
  }
  .panel .hint-key { color: #6d6580; font-size: 11px; margin-top: 10px; letter-spacing: 1px; }
  .panel .hint-key b { color: #9a92b8; font-size: 11px; background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 4px; }
  /* ===== 阶段I · 留存系统（签到 / 任务 / 皮肤）===== */
  /* 入口药丸：开始页与结算页各一排，右上角红点表示"有东西可领" */
  .menuRow { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .menuBtn {
    position: relative;
    display: inline-flex; align-items: center; gap: 5px;
    padding: 8px 14px; border-radius: 999px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.13);
    color: #cfc8e4; font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
    cursor: pointer; -webkit-appearance: none; appearance: none;
    font-family: inherit;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  .menuBtn:active { transform: scale(0.94); }
  .menuBtn.dot::after {
    content: ''; position: absolute; right: -2px; top: -2px;
    width: 9px; height: 9px; border-radius: 50%;
    background: #ff4d6d; box-shadow: 0 0 0 2px rgba(13,10,22,0.9), 0 0 8px rgba(255,77,109,0.9);
    animation: dotPulse 1.4s ease-in-out infinite;
  }
  @keyframes dotPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
  /* 底部抽屉 */
  #sheet {
    position: fixed; inset: 0; z-index: 110; display: none;
    background: rgba(9,7,16,0.78); backdrop-filter: blur(5px);
    align-items: flex-end; justify-content: center;
    font-family: "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  #sheet.on { display: flex; }
  #sheet .sheetCard {
    width: 100%; max-width: 430px;
    background: linear-gradient(180deg,#241d38,#15101f);
    border: 1px solid rgba(255,255,255,0.10);
    border-bottom: none;
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -14px 44px rgba(0,0,0,0.6);
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
    max-height: 84vh; overflow-y: auto;
    animation: sheetUp 0.28s cubic-bezier(0.22,1.1,0.36,1);
  }
  @keyframes sheetUp { from { transform: translateY(24px); opacity: 0.4; } to { transform: none; opacity: 1; } }
  #sheet .sheetHead {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  #sheet .sheetHead span { font-size: 16px; font-weight: 900; color: #efe9ff; letter-spacing: 1px; }
  #sheet .sheetHead button {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.07); border: none;
    color: #9a92b8; font-size: 15px; cursor: pointer; line-height: 1;
    -webkit-appearance: none; appearance: none;
  }
  #sheet .sBtn {
    display: block; width: 100%; box-sizing: border-box;
    margin: 12px 0 0; padding: 12px;
    border: none; border-radius: 12px;
    font-size: 14px; font-weight: 800; letter-spacing: 0.5px; cursor: pointer;
    font-family: inherit;
  }
  #sheet .sBtn:active { transform: scale(0.98); }
  #sheet .sBtn.main { background: linear-gradient(135deg,#ffcf5b,#ff9f6b); color: #2a1608; }
  #sheet .sBtn.ad { background: linear-gradient(135deg,#4ade80,#22c55e); color: #06240f; }
  #sheet .ciFoot { font-size: 11.5px; color: #7d759b; text-align: center; margin: 10px 0 0; }
  #sheet .ciFoot.ok { color: #7bffa8; font-weight: 700; }
  #sheet .ciFoot b { color: #ffe08a; }
  /* 签到 7 宫格：4+3 布局，第 7 天横跨整行做「大奖」 */
  .ciGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ciCell {
    position: relative; text-align: center;
    padding: 9px 4px 8px; border-radius: 12px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .ciCell .d { font-size: 10.5px; color: #7d759b; }
  .ciCell .ico { font-size: 24px; line-height: 1.25; }
  .ciCell .lbl { font-size: 10.5px; color: #b9b1d4; }
  .ciCell.big { grid-column: span 3; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; }
  .ciCell.big .ico { font-size: 28px; }
  .ciCell.big .lbl { font-size: 13px; color: #ffe08a; font-weight: 800; }
  .ciCell.cur {
    background: rgba(255,207,91,0.14);
    border-color: rgba(255,207,91,0.55);
    box-shadow: 0 0 14px rgba(255,207,91,0.22);
  }
  .ciCell.got { opacity: 0.45; }
  .ciCell .tick {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 26px; color: #7bffa8; text-shadow: 0 2px 8px rgba(0,0,0,0.7);
  }
  /* 任务列表 */
  .qList { display: flex; flex-direction: column; gap: 8px; }
  .qRow {
    display: flex; align-items: center; gap: 10px;
    padding: 10px; border-radius: 12px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .qRow.claimed { opacity: 0.5; }
  .qIco { font-size: 22px; width: 26px; text-align: center; }
  .qMid { flex: 1; min-width: 0; }
  .qLbl { font-size: 12.5px; color: #dcd5f0; font-weight: 700; }
  .qBar { height: 5px; border-radius: 99px; background: rgba(255,255,255,0.10); margin: 5px 0 3px; overflow: hidden; }
  .qBar i { display: block; height: 100%; background: linear-gradient(90deg,#ffcf5b,#ff9f6b); }
  .qNum { font-size: 10.5px; color: #7d759b; font-variant-numeric: tabular-nums; }
  .qBtn {
    flex: none; padding: 8px 11px; border-radius: 10px; border: none;
    background: linear-gradient(135deg,#ffcf5b,#ff9f6b); color: #2a1608;
    font-size: 12.5px; font-weight: 900; cursor: pointer; font-family: inherit;
    white-space: nowrap;
  }
  .qBtn.off { background: rgba(255,255,255,0.08); color: #6a6386; cursor: default; }
  .qGot { flex: none; font-size: 12px; color: #7bffa8; font-weight: 800; }
  .qBonus {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 10px; padding: 10px 12px; border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px dashed rgba(255,255,255,0.14);
    font-size: 13px; color: #b9b1d4; font-weight: 700;
  }
  .qBonus.ready { border-color: rgba(255,207,91,0.6); background: rgba(255,207,91,0.10); }
  .qBonus.claimed { opacity: 0.5; }
  .qBonus b { color: #7bffa8; font-size: 12px; }
  /* 皮肤网格 */
  .skGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
  .skCard {
    text-align: center; padding: 11px 8px 10px; border-radius: 14px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .skCard.cur { border-color: rgba(123,255,168,0.55); background: rgba(123,255,168,0.09); }
  .skCard.lock .skPrev { filter: grayscale(0.75) brightness(0.8); }
  .skPrev { font-size: 25px; line-height: 1.1; letter-spacing: 1px; }
  .skName { font-size: 12.5px; color: #dcd5f0; font-weight: 800; margin: 5px 0 8px; }
  .skBtn {
    width: 100%; padding: 8px; border-radius: 10px; border: none;
    font-size: 12.5px; font-weight: 900; cursor: pointer; font-family: inherit;
  }
  .skBtn.use { background: rgba(255,255,255,0.10); color: #cfc8e4; }
  .skBtn.buy { background: linear-gradient(135deg,#ffcf5b,#ff9f6b); color: #2a1608; }
  .skBtn.off { background: rgba(255,255,255,0.06); color: #6a6386; cursor: default; }
  .skOn { padding: 8px; font-size: 12.5px; font-weight: 900; color: #7bffa8; }
  .skLock { padding: 8px; font-size: 11.5px; color: #7d759b; font-weight: 700; }
  /* ===== 阶段O · 商店页 & 抽屉金币栏 ===== */
  .shRow {
    display: flex; align-items: center; gap: 10px;
    padding: 10px; border-radius: 12px; margin-bottom: 8px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .shIco { font-size: 24px; width: 34px; text-align: center; }
  .shMid { flex: 1; min-width: 0; }
  .shName { font-size: 14px; color: #efe9ff; font-weight: 800; }
  .shDesc { font-size: 11.5px; color: #7d759b; margin-top: 2px; }
  .shOwn { flex: none; font-size: 11px; color: #7bffa8; font-weight: 800; margin-right: 2px; }
  .shBuy {
    flex: none; padding: 9px 14px; border: none; border-radius: 10px;
    background: linear-gradient(135deg,#ffcf5b,#ff9f6b); color: #2a1608;
    font-size: 13px; font-weight: 900; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .shBuy:disabled { opacity: 0.45; cursor: default; background: rgba(255,255,255,0.10); color: #6a6386; }
  .shFoot { font-size: 11.5px; color: #7d759b; text-align: center; margin: 10px 0 0; }
  .sheetCoin {
    margin-top: 12px; padding-top: 10px;
    border-top: 1px dashed rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 13.5px; color: #ffe08a; font-weight: 800;
  }
  .sheetCoin b { font-variant-numeric: tabular-nums; font-size: 16px; }
  /* ===== 阶段H · 广告变现 ===== */
  .panel .btnCol { display: flex; flex-direction: column; gap: 9px; margin-top: 16px; }
  .panel .btnCol button { margin-top: 0; padding: 12px 20px; width: 100%; box-sizing: border-box; }
  .panel button.ad {
    background: linear-gradient(135deg,#4ade80,#22c55e);
    color: #06240f;
    box-shadow: 0 6px 18px rgba(34,197,94,0.35);
    animation: adPulse 1.9s ease-in-out infinite;
  }
  /* 次级广告位（金币×2）：白拿但价值低于复活，降一档权重避免抢注意力 */
  .panel button.ad.sec {
    background: rgba(34,197,94,0.12);
    color: #7bffa8;
    border: 1px solid rgba(74,222,128,0.45);
    box-shadow: none;
    animation: none;
  }
  @keyframes adPulse {
    0%,100% { box-shadow: 0 6px 18px rgba(34,197,94,0.30); }
    50%     { box-shadow: 0 6px 26px rgba(34,197,94,0.60); }
  }
  .panel button.ghost {
    background: rgba(255,255,255,0.07);
    color: #cfc8e4;
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: none;
    font-weight: 700;
  }
  .panel button:disabled { opacity: 0.4; cursor: default; box-shadow: none; }
  /* 无真实广告 SDK 时的模拟播放遮罩（本地/H5 预览用） */
  #adVeil {
    position: fixed; inset: 0; z-index: 90; display: none;
    background: #07060d;
    align-items: center; justify-content: center; flex-direction: column; gap: 18px;
    font-family: "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color: #cfc8e4;
  }
  #adVeil.on { display: flex; }
  #adVeil .tag { font-size: 11px; letter-spacing: 3px; color: #6d6580; }
  #adVeil .big { font-size: 46px; }
  #adVeil .lbl { font-size: 14px; color: #9a92b8; }
  #adVeil .track { width: 190px; height: 5px; border-radius: 99px; background: rgba(255,255,255,0.1); overflow: hidden; }
  #adVeil .track i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg,#4ade80,#22c55e); }
  /* 道具耗尽时的获取弹窗 */
  #shopPop {
    position: fixed; inset: 0; z-index: 60; display: none;
    background: rgba(13,10,22,0.82); backdrop-filter: blur(4px);
    align-items: center; justify-content: center;
    font-family: "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    padding: 20px;
  }
  #shopPop.on { display: flex; }
  #shopPop .card {
    background: linear-gradient(160deg,#241d38,#181225);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 22px 20px 18px; text-align: center;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    width: 260px; max-width: 86vw;
    animation: pop 0.28s cubic-bezier(0.34,1.56,0.64,1);
  }
  #shopPop .ico { font-size: 38px; line-height: 1; }
  #shopPop h3 { font-size: 16px; color: #efe9ff; margin: 8px 0 2px; letter-spacing: 1px; }
  #shopPop .desc { font-size: 12px; color: #8d85ad; margin-bottom: 14px; }
  #shopPop button {
    display: block; width: 100%; box-sizing: border-box;
    margin: 8px 0 0; padding: 11px 12px;
    border: none; border-radius: 12px;
    font-size: 14px; font-weight: 800; letter-spacing: 1px; cursor: pointer;
    transition: transform 0.1s ease;
  }
  #shopPop button:active { transform: scale(0.96); }
  #shopPop .buy { background: linear-gradient(135deg,#ffcf5b,#ff9f6b); color: #2a1608; }
  #shopPop .buy:disabled { opacity: 0.4; cursor: default; }

  // 样式回落到上一次的值（默认黑），于是画面上出现莫名的黑边。

    const n = hex.match(/-?\d+/g) || [0, 0, 0];
    return `rgba(${n[0]},${n[1]},${n[2]},${a})`;
  }
  const c = hexToRgb(hex);
  return `rgba(${c.r},${c.g},${c.b},${a})`;
}

// ========== 游戏状态 ==========
let balls = [], particles = [], popups = [], rings = [];
let score = 0, merges = 0;
let best = +(localStorage.getItem('suikaBest') || 0);
let combo = 0, lastMergeAt = 0;
let pending = null, nextLevel = 1;
let dropCd = 0;
let dangerTimer = 0;
let seenLevels = [];
let gameOver = false, shake = 0, banner = null;
let hitstop = 0, flash = 0;
let tSec = 0;
let slowmo = 0, nearMissCd = 0;
let runBest = best, beatBest = false;
let nextGolden = false;
const keys = { left: false, right: false };
let audioCtx = null;
let muted = false;
let started = false; // splash dismissed
let runStartAt = Date.now();   // 本局开始的墙钟时间（阶段J 埋点算时长用）

// ========== 初始化布局（此时 balls/clamp 均已就绪） ==========
resize();

// ========== 音频（Web Audio 合成，零素材） ==========
let masterGain = null, ambient = null;
const PENTA = [0, 2, 4, 7, 9];
const noteFreq = semi => 220 * Math.pow(2, semi / 12);
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  masterGain = audioCtx.createGain();
  masterGain.gain.value = muted ? 0 : 0.85;
  masterGain.connect(audioCtx.destination);
  startAmbient();
}
function toggleMute() {
  muted = !muted;
  soundBtn.textContent = muted ? '🔇' : '🔊';
  if (masterGain) masterGain.gain.setTargetAtTime(muted ? 0 : 0.85, audioCtx.currentTime, 0.05);
}
soundBtn.addEventListener('click', e => { e.stopPropagation(); toggleMute(); });
soundBtn.addEventListener('pointerdown', e => e.stopPropagation());

function startAmbient() {
  if (!audioCtx) return;
  const g = audioCtx.createGain(); g.gain.value = 0.02;
  const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 340;
  const o1 = audioCtx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 55;
  const o2 = audioCtx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 82.4;
  const o3 = audioCtx.createOscillator(); o3.type = 'sawtooth'; o3.frequency.value = 110;
  const lfo = audioCtx.createOscillator(); lfo.frequency.value = 0.07;
  const lfoG = audioCtx.createGain(); lfoG.gain.value = 90;
  lfo.connect(lfoG); lfoG.connect(lp.frequency);
  o1.connect(lp); o2.connect(lp); o3.connect(lp); lp.connect(g); g.connect(masterGain);
  o1.start(); o2.start(); o3.start(); lfo.start();
  ambient = { g, lp };
}
function setAmbient(intensity) {
  if (!ambient || !audioCtx) return;
  const t = audioCtx.currentTime;
  ambient.g.gain.setTargetAtTime(0.015 + intensity * 0.075, t, 0.25);
  ambient.lp.frequency.setTargetAtTime(280 + intensity * 950, t, 0.25);
}
function mergeSound(level, cmb) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const stepN = Math.min(cmb - 1, 14);
  const semi = PENTA[stepN % 5] + 12 * Math.floor(stepN / 5) + Math.min(level - 1, 6) + 12;
  const base = noteFreq(semi);
  [{ type: 'sine', mul: 1, g: 0.24 }, { type: 'triangle', mul: 2.01, g: 0.10 }].forEach(v => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = v.type; o.frequency.setValueAtTime(base * v.mul, t);
    g.gain.setValueAtTime(v.g, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22 + level * 0.01);
    o.connect(g); g.connect(masterGain); o.start(t); o.stop(t + 0.3 + level * 0.01);
  });
}
function bigChord() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [0, 4, 7, 12, 16, 19].forEach((semi, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'triangle'; o.frequency.value = noteFreq(semi) * 2;
    const st = t + i * 0.055;
    g.gain.setValueAtTime(0, st);
    g.gain.linearRampToValueAtTime(0.2, st + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, st + 0.7);
    o.connect(g); g.connect(masterGain); o.start(st); o.stop(st + 0.75);
  });
}
function dropTick() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(680, t);
  o.frequency.exponentialRampToValueAtTime(340, t + 0.04);
  g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
  o.connect(g); g.connect(masterGain); o.start(t); o.stop(t + 0.07);
}
function landThud(level) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(120 - level * 4, t);
  o.frequency.exponentialRampToValueAtTime(60, t + 0.1);
  g.gain.setValueAtTime(0.04 + level * 0.006, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.connect(g); g.connect(masterGain); o.start(t); o.stop(t + 0.14);
}
function nearMissSound() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  const lp = audioCtx.createBiquadFilter(); lp.type = 'bandpass'; lp.frequency.value = 700; lp.Q.value = 4;
  o.type = 'sawtooth'; o.frequency.setValueAtTime(220, t);
  o.frequency.exponentialRampToValueAtTime(1000, t + 0.45);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.13, t + 0.06);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  o.connect(lp); lp.connect(g); g.connect(masterGain); o.start(t); o.stop(t + 0.52);
}
function jackpotSound() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [0, 4, 7, 12, 16, 19, 24].forEach((semi, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'square'; o.frequency.value = noteFreq(semi) * 2;
    const st = t + i * 0.04;
    g.gain.setValueAtTime(0, st);
    g.gain.linearRampToValueAtTime(0.14, st + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, st + 0.35);
    o.connect(g); g.connect(masterGain); o.start(st); o.stop(st + 0.38);
  });
}
function gameOverSound() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [0, 0.16, 0.34].forEach((d, i) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(300 - i * 70, t + d);
    o.frequency.exponentialRampToValueAtTime(90 - i * 20, t + d + 0.3);
    g.gain.setValueAtTime(0.16, t + d);
    g.gain.exponentialRampToValueAtTime(0.001, t + d + 0.32);
    o.connect(g); g.connect(masterGain); o.start(t + d); o.stop(t + d + 0.34);
  });
}

// ========== 生成 / 掉落 ==========
function makeBall(level, x, y, vx, vy) {
  return { level, x, y, vx, vy, r: radius(level),
           released: false, touching: false, sleeping: false, rest: 0,
           fuse: 0, expired: false, spawnT: 0, wobble: 0, golden: false };
}
function newPending() {
  pending = { level: nextLevel, x: pending ? pending.x : W / 2, golden: nextGolden };
  nextLevel = randLevel();
  nextGolden = nextLevel <= 3 && Math.random() < 0.07;
  nextEl.textContent = (nextGolden ? '✨' : '') + FRUITS[nextLevel - 1].emoji;
}
function drop() {
  if (gameOver || !pending || dropCd > 0) return;
  if (typeof takeSnapshot === 'function') takeSnapshot();
  const b = makeBall(pending.level, pending.x, 26, 0, 0);
  b.released = true;
  b.golden = pending.golden;
  balls.push(b);
  dropTick();
  dropCd = Math.max(0.20, 0.40 - score * 0.0001);
  newPending();
  if (typeof checkScoreReward === 'function') checkScoreReward();
  if (typeof tutOnDrop === 'function') tutOnDrop();
}

// ========== 特效 ==========
function burst(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 180;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60,
                     life: 0.5 + Math.random() * 0.3, maxLife: 0.8, color, size: 2 + Math.random() * 3.5 });
  }
}
function popup(text, x, y, color, size) {
  popups.push({ text, x, y, life: 0.9, color, size });
}
function ring(x, y, color, maxR) {
  rings.push({ x, y, r: 4, maxR, life: 0.45, color });
}
function bigBurst(b) {
  burst(b.x, b.y, '#22c55e', 30);
  burst(b.x, b.y, '#a6e3a1', 14);
  ring(b.x, b.y, '#a6e3a1', 120);
}

// ========== 合并 ==========
function removeBall(b) {
  const i = balls.indexOf(b);
  if (i >= 0) balls.splice(i, 1);
}
function doMerge(a, b) {
  const level = a.level + 1;
  const nx = (a.x + b.x) / 2, ny = (a.y + b.y) / 2;
  const vx = (a.vx + b.vx) / 2, vy = (a.vy + b.vy) / 2;
  removeBall(a); removeBall(b);

  const now = tSec;
  combo = (now - lastMergeAt < 1.1) ? combo + 1 : 1;
  lastMergeAt = now;

  const isJackpot = a.golden || b.golden;
  const mult = 1 + Math.min(combo - 1, 8) * 0.5;
  const base = FRUITS[level - 1].score;
  const gain = Math.round(base * mult * (isJackpot ? 5 : 1));
  score += gain;
  merges++;

  const f = FRUITS[level - 1];
  burst(nx, ny, f.color, level === 11 ? 26 : 8 + level);
  burst(nx, ny, lighten(f.color, 0.4), 4 + level);
  ring(nx, ny, f.color, radius(level) * 2.6);
  popup('+' + gain, nx, ny - 12, lighten(f.color, 0.3), 16 + level * 0.6);
  if (combo >= 2) popup(I18N.t('combo_popup') + combo, W / 2, 130, '#ffe08a', 20 + Math.min(combo, 6));
  if (combo >= 3) shake = Math.max(shake, 0.35);
  if (isJackpot) {
    burst(nx, ny, '#ffd54a', 30);
    burst(nx, ny, '#fff3b0', 18);
    ring(nx, ny, '#ffd54a', radius(level) * 4);
    popup(I18N.t('golden_five'), W / 2, 165, '#ffd54a', 30);
    banner = { text: I18N.t('jackpot_banner'), life: 1.2 };
    shake = Math.max(shake, 0.55);
    flash = Math.max(flash, 0.35);
    jackpotSound();
  }

  hitstop = Math.max(hitstop, 0.02 + level * 0.006);
  flash = Math.max(flash, level >= 7 ? 0.25 : 0.08 + level * 0.015);
  if (typeof haptic === 'function') haptic(level >= 7 ? 'heavy' : (level >= 4 ? 'medium' : 'light'));

  const nb = makeBall(level, nx, ny, vx, vy);
  nb.released = true; nb.touching = true; nb.spawnT = 0.32;
  balls.push(nb);
  for (const o of balls) {
    if (o.sleeping && Math.hypot(o.x - nx, o.y - ny) < nb.r * 3.5 + o.r) o.sleeping = false;
  }

  if (level === 11) {
    banner = { text: I18N.t('watermelon_banner'), life: 1.6 };
    shake = Math.max(shake, 0.6);
    flash = Math.max(flash, 0.4);
    bigChord();
    nb.fuse = 0.55;
  } else {
    mergeSound(level, combo);
  }
  if (level >= 5 && level <= 10 && !seenLevels[level]) {
    seenLevels[level] = true;
    banner = { text: I18N.t('first_unlock_prefix') + FRUITS[level - 1].emoji + ' ' + FRUITS[level - 1].name, life: 1.4 };
    popup(I18N.t('newly_unlocked'), W / 2, 100, '#a6e3a1', 20);
    burst(nx, ny, lighten(f.color, 0.5), 20);
    shake = Math.max(shake, 0.4);
    flash = Math.max(flash, 0.22);
    jackpotSound();
  }
  if (!beatBest && runBest > 0 && score > runBest) {
    beatBest = true;
    banner = { text: I18N.t('banner_new_record'), life: 1.6 };
    popup(I18N.t('popup_new_record'), W / 2, 200, '#ffd54a', 26);
    shake = Math.max(shake, 0.5);
    flash = Math.max(flash, 0.3);
    jackpotSound();
  }
  updateScore();
  if (typeof questBump === 'function') { questBump('merge', 1); questPeak('level', level); questPeak('combo', combo); }
  if (typeof tutOnMerge === 'function') tutOnMerge();
  if (typeof onMergeJuice === 'function') onMergeJuice(nx, ny, level, combo, gain, isJackpot);
}

// ========== 物理 ==========
function isSupported(b) {
  if (b.y + b.r >= GROUND - 1) return true;
  for (const o of balls) {
    if (o === b) continue;
    if (o.y > b.y) continue;
    if (Math.abs(o.x - b.x) < Math.max(o.r, b.r) * 1.2 &&
        Math.abs((b.y + b.r) - (o.y - o.r)) < 2) return true;
  }
  return false;
}
function collidePass() {
  const n = balls.length;
  for (let i = 0; i < n; i++) {
    const a = balls[i];
    if (!a || a.expired) continue;
    for (let j = i + 1; j < n; j++) {
      const b = balls[j];
      if (!b || b.expired) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      const min = a.r + b.r;
      if (dist >= min || dist < 0.0001) continue;
      if (a.level === b.level && a.level < 11) { doMerge(a, b); return true; }
      const nx = dx / dist, ny = dy / dist;
      const overlap = min - dist;
      // 两球都睡眠：跳过速度解算保住性能，但重叠明显时做「纯位置」轻推，消除堆叠穿模
      if (a.sleeping && b.sleeping) {
        if (overlap > 1.0) {
          const push = (overlap - 1.0) * 0.5;
          a.x -= nx * push; a.y -= ny * push;
          b.x += nx * push; b.y += ny * push;
        }
        continue;
      }
      if (!a.sleeping && !b.sleeping) { a.x -= nx*overlap/2; a.y -= ny*overlap/2; b.x += nx*overlap/2; b.y += ny*overlap/2; }
      else {
        // 动球 vs 睡眠球：始终做「加权双向」分离。
        // 睡眠球只吃 30% 位移（保住堆叠稳定不抖），但绝不再是「永不被推开」的墙——
        // 否则动球会长期嵌在缝隙里穿模（场地变矮后堆叠更挤，这点尤其明显）。
        const wSleep = 0.3, wMove = 0.7;
        if (overlap > 1.2) {
          if (a.sleeping) { a.sleeping = false; a.rest = 0; }
          if (b.sleeping) { b.sleeping = false; b.rest = 0; }
        }
        if (a.sleeping) { a.x -= nx*overlap*wSleep; a.y -= ny*overlap*wSleep; b.x += nx*overlap*wMove; b.y += ny*overlap*wMove; }
        else            { a.x -= nx*overlap*wMove;  a.y -= ny*overlap*wMove;  b.x += nx*overlap*wSleep; b.y += ny*overlap*wSleep; }
      }
      a.touching = b.touching = true;
      const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
      const vn = rvx * nx + rvy * ny;
      if (vn < 0) {
        const imp = (-vn * (1 + REST)) / 2;
        if (!a.sleeping) { a.vx -= imp * nx; a.vy -= imp * ny; }
        if (!b.sleeping) { b.vx += imp * nx; b.vy += imp * ny; }
        if (a.sleeping && imp > 50) a.sleeping = false;
        if (b.sleeping && imp > 50) b.sleeping = false;
        if (imp > 120) { a.wobble = b.wobble = Math.min(0.5, imp / 600); }
      }
    }
  }
  return false;
}
function step(dt) {
  tSec += dt;
  if (!gameOver && pending) {
    if (keys.left)  pending.x = clamp(pending.x - 260 * dt, radius(pending.level), W - radius(pending.level));
    if (keys.right) pending.x = clamp(pending.x + 260 * dt, radius(pending.level), W - radius(pending.level));
  }
  for (const b of balls) {
    if (b.sleeping || b.expired) continue;
    b.vy += GRAV * dt;
    // 速度钳制（终端速度）
    if (b.vy >  MAX_V) b.vy =  MAX_V;
    if (b.vy < -MAX_V) b.vy = -MAX_V;
    if (b.vx >  MAX_V) b.vx =  MAX_V;
    if (b.vx < -MAX_V) b.vx = -MAX_V;
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.vx *= (1 - 0.8 * dt);
  }
  for (const b of balls) {
    if (b.sleeping || b.expired) continue;
    if (b.x - b.r < 0)  { b.x = b.r;  if (b.vx < 0) b.vx = -b.vx * REST; }
    if (b.x + b.r > W)  { b.x = W - b.r; if (b.vx > 0) b.vx = -b.vx * REST; }
    if (b.y + b.r > GROUND) {
      b.y = GROUND - b.r; b.touching = true;
      if (b.vy > 0) { if (b.vy > 80) b.vy = -b.vy * REST; else b.vy = 0; }
    }
  }
  for (let k = 0; k < 14; k++) { if (!collidePass()) break; }
  // 边界硬约束：对「所有」球生效（含睡眠球）。
  // 解算器会把睡眠球挤出边界，若这里跳过睡眠球，它们会永久穿地/穿墙。
  for (const b of balls) {
    if (b.expired) continue;
    if (b.x - b.r < 0)  b.x = b.r;
    if (b.x + b.r > W)  b.x = W - b.r;
    if (b.y + b.r > GROUND) { b.y = GROUND - b.r; b.touching = true; if (b.vy > 0) b.vy = 0; }
  }
  for (const b of balls) {
    if (b.expired) continue;
    if (b.fuse > 0) { b.fuse -= dt; if (b.fuse <= 0) { b.expired = true; bigBurst(b); } }
    if (b.spawnT > 0) b.spawnT = Math.max(0, b.spawnT - dt);
    if (b.wobble > 0) b.wobble = Math.max(0, b.wobble - dt * 2.2);
  }
  balls = balls.filter(b => !b.expired);
  if (dropCd > 0) dropCd = Math.max(0, dropCd - dt);
  if (!gameOver) {
    let overLine = false;
    for (const b of balls) {
      if (b.released && b.touching && b.y - b.r < DANGER) { overLine = true; break; }
    }
    if (overLine) {
      dangerTimer += dt;
      if (dangerTimer > 0.6) gameOverNow();
    } else {
      dangerTimer = 0;
    }
  }
  const top = stackTop();
  const dangerInt = clamp((DANGER + 150 - top) / 200, 0, 1);
  setAmbient(dangerInt);
  if (nearMissCd > 0) nearMissCd -= dt;
  if (!gameOver && nearMissCd <= 0 && dangerTimer === 0 && top > DANGER && top < DANGER + 24) {
    slowmo = 0.55; nearMissCd = 4;
    popup(I18N.t('close_call'), W / 2, DANGER + 40, '#ff9a6b', 22);
    nearMissSound();
  }
  if (slowmo > 0) slowmo = Math.max(0, slowmo - dt);
  for (const b of balls) {
    if (b.sleeping || !b.released || b.expired) continue;
    if (Math.hypot(b.vx, b.vy) < 6 && isSupported(b)) b.rest += dt; else b.rest = 0;
    if (b.rest > 0.35) {
      b.sleeping = true; b.vx = 0; b.vy = 0;
      if (b.level >= 3) landThud(b.level);
    }
  }
  for (const p of particles) { p.life -= dt; p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) { p.life -= dt; p.y -= 45 * dt; }
  popups = popups.filter(p => p.life > 0);
  for (const r of rings) { r.life -= dt; r.r += (r.maxR - r.r) * Math.min(1, dt * 9); }
  rings = rings.filter(r => r.life > 0);
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
  if (shake > 0) shake = Math.max(0, shake - dt);
  if (flash > 0) flash = Math.max(0, flash - dt * 2.2);
  // 金币结算放在每帧：合成瞬间即时弹 +💰（多汁反馈），且不漏结算临终前最后一波分数
  if (!gameOver && typeof checkScoreReward === 'function') checkScoreReward();
}

// ========== 渲染 ==========
function drawFruit(level, x, y, scaleX, scaleY, golden) {
  const rr = radius(level);
  const f = FRUITS[level - 1];
  ctx.save();
  ctx.translate(x, y);
  if (scaleX !== 1 || scaleY !== 1) ctx.scale(scaleX, scaleY);
  if (golden) {
    const pulse = 0.5 + 0.5 * Math.sin(tSec * 8);
    ctx.save();
    ctx.globalAlpha = 0.45 + 0.35 * pulse;
    ctx.shadowColor = 'rgba(255,213,74,0.95)';
    ctx.shadowBlur = 22 + pulse * 12;
    ctx.strokeStyle = '#ffe08a';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, rr * (1.12 + pulse * 0.06), 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  // 接地软阴影：用径向渐变（而非实心椭圆）——实心椭圆会在水果下缘露出一道硬边黑月牙，
  // 多个水果叠在一起时还会累加变更黑，非常廉价。
  ctx.save();
  ctx.translate(0, rr * 0.94);
  ctx.scale(1, 0.30);
  const sh = ctx.createRadialGradient(0, 0, rr * 0.15, 0, 0, rr * 0.98);
  sh.addColorStop(0, 'rgba(0,0,0,0.30)');
  sh.addColorStop(0.55, 'rgba(0,0,0,0.16)');
  sh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sh;
  ctx.beginPath(); ctx.arc(0, 0, rr * 0.98, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.shadowColor = golden ? 'rgba(255,213,74,0.9)' : rgba(f.color, 0.75);
  ctx.shadowBlur = 14 + level * 1.5;
  const g = ctx.createRadialGradient(-rr * 0.35, -rr * 0.4, rr * 0.12, 0, 0, rr);
  g.addColorStop(0, lighten(f.color, 0.6));
  g.addColorStop(0.5, f.color);
  g.addColorStop(1, darken(f.color, 0.2));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = rgba(lighten(f.color, 0.3), 0.5);
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, rr - 0.8, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.ellipse(-rr * 0.3, -rr * 0.36, rr * 0.24, rr * 0.15, -0.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.beginPath(); ctx.arc(rr * 0.28, rr * 0.3, rr * 0.09, 0, Math.PI * 2); ctx.fill();
  ctx.font = Math.round(rr * 1.25) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.globalAlpha = 1;
  ctx.fillText(f.emoji, 0, rr * 0.04);
  ctx.restore();
}

function stackTop() {
  let top = GROUND;
  for (const b of balls) if (b.released && b.touching) top = Math.min(top, b.y - b.r);
  return top;
}
function drawBackground() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#251d40');
  bg.addColorStop(0.55, '#1b1530');
  bg.addColorStop(1, '#140f24');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const top = stackTop();
  const danger = clamp((DANGER + 120 - top) / 180, 0, 1);
  const glow = ctx.createRadialGradient(W/2, GROUND, 10, W/2, GROUND, 320);
  glow.addColorStop(0, `rgba(${Math.round(90+danger*120)},${Math.round(70-danger*40)},${Math.round(160-danger*90)},0.28)`);
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  const vig = ctx.createRadialGradient(W/2, H/2, H*0.42, W/2, H/2, H*0.78);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.26)');
  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
}
function draw() {
  ctx.save();
  if (shake > 0) {
    const s = shake * 7;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }
  drawBackground();
  // Walls
  const wall = ctx.createLinearGradient(0, 0, 6, 0);
  wall.addColorStop(0, 'rgba(255,255,255,0.10)');
  wall.addColorStop(1, 'rgba(255,255,255,0.0)');
  ctx.fillStyle = wall; ctx.fillRect(0, 0, 6, H);
  const wall2 = ctx.createLinearGradient(W-6, 0, W, 0);
  wall2.addColorStop(0, 'rgba(255,255,255,0.0)');
  wall2.addColorStop(1, 'rgba(255,255,255,0.10)');
  ctx.fillStyle = wall2; ctx.fillRect(W-6, 0, 6, H);
  // Ground
  const gnd = ctx.createLinearGradient(0, GROUND, 0, H);
  gnd.addColorStop(0, 'rgba(255,255,255,0.12)');
  gnd.addColorStop(1, 'rgba(255,255,255,0.02)');
  ctx.fillStyle = gnd; ctx.fillRect(0, GROUND, W, H - GROUND);
  // Danger line
  let near = 0;
  for (const b of balls) {
    if (b.released) {
      const d = (b.y - b.r) - DANGER;
      if (d < 80) near = Math.max(near, clamp((80 - d) / 80, 0, 1));
    }
  }
  const pulse = 0.4 + 0.3 * Math.sin(tSec * 6) * near;
  ctx.save();
  ctx.setLineDash([10, 8]);
  ctx.strokeStyle = `rgba(${Math.round(243+near*12)},${Math.round(139-near*139)},${Math.round(168-near*130)},${clamp(pulse+0.25,0,0.95)})`;
  ctx.lineWidth = 1.5 + near * 1.5;
  ctx.beginPath(); ctx.moveTo(0, DANGER); ctx.lineTo(W, DANGER); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = `rgba(243,139,168,${clamp(0.5+near*0.4,0,0.95)})`;
  ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(I18N.t('danger_line'), 8, DANGER - 6);
  // Fruits
  for (const b of balls) {
    if (b.fuse > 0 && Math.floor(b.fuse * 14) % 2 === 0) continue;
    let sx = 1, sy = 1;
    if (b.spawnT > 0) {
      const p = b.spawnT / 0.32;
      const e = 1 - p;
      const bounce = Math.sin(e * Math.PI) * 0.22 * p;
      sx = 1 + bounce; sy = 1 - bounce;
    } else if (b.wobble > 0) {
      const w = b.wobble * Math.sin(tSec * 40) * 0.3;
      sx = 1 + w; sy = 1 - w;
    }
    drawFruit(b.level, b.x, b.y, sx, sy, b.golden);
  }
  // Pending
  if (pending && !gameOver) {
    const r = radius(pending.level);
    ctx.save();
    ctx.setLineDash([3, 7]); ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(pending.x, 26 + r); ctx.lineTo(pending.x, GROUND - 4); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.arc(pending.x, GROUND - r - 2, r, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 0.85 + 0.1 * Math.sin(tSec * 5);
    drawFruit(pending.level, pending.x, 26, 1, 1, pending.golden);
    ctx.globalAlpha = 1;
  }
  // Rings
  for (const rg of rings) {
    ctx.globalAlpha = Math.max(0, rg.life / 0.45) * 0.7;
    ctx.strokeStyle = rg.color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // Particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / (p.maxLife || 0.8));
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Popups
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.5));
    ctx.fillStyle = p.color;
    ctx.font = 'bold ' + p.size + 'px "PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  // Goal gradient HUD
  if (!gameOver && runBest > 0 && score < runBest) {
    const remain = runBest - score;
    const prog = clamp(score / runBest, 0, 1);
    const bw = 150, bx = W / 2 - bw / 2, by = 48;
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = 'rgba(255,224,138,0.9)';
    ctx.font = '12px "PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(I18N.t('remain_fmt').replace('{n}', remain), W / 2, by - 8);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(bx, by, bw, 4);
    ctx.fillStyle = '#ffd54a';
    ctx.fillRect(bx, by, bw * prog, 4);
    ctx.globalAlpha = 1;
  }
  // Banner
  if (banner) {
    const a = Math.min(1, banner.life);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffe08a';
    ctx.font = 'bold 36px "PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.save();
    ctx.shadowColor = 'rgba(255,180,60,0.7)'; ctx.shadowBlur = 20;
    ctx.fillText(banner.text, W / 2, 120);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  // Flash overlay
  if (flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${flash})`;
    ctx.fillRect(0, 0, W, H);
  }
}

// ========== 流程控制 ==========
function updateScore() {
  scoreEl.textContent = score;
  bestEl.textContent = best;
}
function gameOverNow() {
  gameOver = true;
  const isNew = score > best;
  if (isNew) { best = score; localStorage.setItem('suikaBest', best); }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalMerges').textContent = merges;
  let peak = 0;
  for (let i = 1; i <= 11; i++) if (seenLevels[i]) peak = i;
  for (const b of balls) if (b.level > peak) peak = b.level;
  document.getElementById('finalPeak').textContent = peak > 0
    ? FRUITS[peak - 1].emoji + ' ' + FRUITS[peak - 1].name : '—';
  document.getElementById('finalBest').textContent = best;
  document.getElementById('newRec').style.display = isNew && score > 0 ? 'block' : 'none';
  overlay.classList.remove('hidden');
  gameOverSound();
  if (typeof questBump === 'function') { questBump('play', 1); questPeak('score', score); }
  if (typeof updateMenuDots === 'function') updateMenuDots();
  if (typeof onGameOverAds === 'function') onGameOverAds();
  if (typeof onGameOverShare === 'function') onGameOverShare();
  if (typeof track === 'function') {
    let pk = 0;
    for (let i = 1; i <= 11; i++) if (seenLevels[i]) pk = i;
    track('game_over', { score: score, merges: merges, peak: pk, best: best, newRec: isNew && score > 0,
                         sec: Math.round((Date.now() - runStartAt) / 1000) });
  }
}
function restart() {
  balls = []; particles = []; popups = []; rings = [];
  score = 0; merges = 0; combo = 0; lastMergeAt = 0;
  shake = 0; banner = null; gameOver = false; hitstop = 0; flash = 0;
  slowmo = 0; nearMissCd = 0; nextGolden = false;
  dropCd = 0; dangerTimer = 0;
  seenLevels = [];
  runBest = best; beatBest = false;
  overlay.classList.add('hidden');
  pending = null; newPending();
  updateScore();
  if (typeof adsOnRestart === 'function') adsOnRestart();
  if (typeof closeShare === 'function') closeShare();
  runStartAt = Date.now();
  if (typeof track === 'function') track('game_start', { from: 'restart', best: best, coins: coins });
}

// ========== 输入 ==========
// 落果规则（按需求重做）：按住 → 果被吸附并跟随拖动；拖动距离达到阈值后松手 → 才落下。
// 轻点/单击（几乎没拖动）不落果，避免误触。键盘 ←/→ 仍可移动预备果、空格仍直接落果。
function ptrToLogical(e) {
  const rect = canvas.getBoundingClientRect();
  return (e.clientX - rect.left) / rect.width * W;
}
const DROP_DRAG_MIN = 8;              // 需拖动的逻辑距离下限（W=400 坐标系），防误触
let holdPtr = null;                   // { id, startX, moved }
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  canvas.setPointerCapture(e.pointerId);
  holdPtr = null;
  if (bombArmed || gameOver || !pending) return;   // 炸弹瞄准 / 结算 / 无预备果时不抓果
  holdPtr = { id: e.pointerId, startX: ptrToLogical(e), moved: 0 };
  pending.x = clamp(holdPtr.startX, radius(pending.level), W - radius(pending.level));
});
canvas.addEventListener('pointermove', e => {
  if (!holdPtr || holdPtr.id !== e.pointerId) return;   // 只有按住的指针能拖果（鼠标悬停不再带动）
  if (bombArmed || gameOver || !pending) return;
  const x = clamp(ptrToLogical(e), radius(pending.level), W - radius(pending.level));
  holdPtr.moved = Math.max(holdPtr.moved, Math.abs(x - holdPtr.startX));
  pending.x = x;
});
function endHold(e, allowDrop) {
  if (!holdPtr || (e && e.pointerId !== holdPtr.id)) return;
  const enough = holdPtr.moved >= DROP_DRAG_MIN;
  holdPtr = null;
  if (allowDrop && enough) drop();
}
canvas.addEventListener('pointerup', e => endHold(e, true));
canvas.addEventListener('pointercancel', e => endHold(e, false));
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') keys.left = true;
  if (e.key === 'ArrowRight') keys.right = true;
  if (e.key === ' ') { e.preventDefault(); initAudio(); if (!e.repeat) drop(); }
  if ((e.key === 'r' || e.key === 'R' || e.key === 'Enter') && (gameOver || !balls.length)) {
    e.preventDefault(); initAudio(); restart();
  }
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'ArrowRight') keys.right = false;
});
document.getElementById('restart').addEventListener('click', restart);

// Prevent iOS rubber-band / overscroll
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// ========== Splash / Start ==========
if (best > 0) document.getElementById('splashBest').textContent = T('splash_best_prefix', '最高纪录: ') + best;
function startGame() {
  if (started) return;
  started = true;
  initAudio();
  splash.classList.add('gone');
  setTimeout(() => splash.style.display = 'none', 400);
  hudEl.style.display = '';
  soundBtn.style.display = '';
  newPending();
  updateScore();
  // 回访玩家（已有纪录）开局先把签到摆出来；新玩家先让他玩，别拦第一局
  if (best > 0 && typeof maybeAutoCheckin === 'function') maybeAutoCheckin();
  if (typeof updateItemBar === 'function') updateItemBar();
  runStartAt = Date.now();
  if (typeof tutStart === 'function') tutStart();
  if (typeof track === 'function') track('game_start', { from: 'splash', best: best, coins: coins });
}
// 启动页上的按钮（签到/任务/皮肤/商店）走抽屉，不应触发开局
function onSplashUI(e) {
  const t = e && e.target;
  return !!(t && t.closest && t.closest('button, [data-menu], a'));
}
splash.addEventListener('pointerdown', e => { if (!onSplashUI(e)) startGame(); });
splash.addEventListener('keydown', e => { if (!onSplashUI(e)) startGame(); });
window.addEventListener('keydown', e => {
  if (!started && (e.key === ' ' || e.key === 'Enter')
      && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('button'))) startGame();
});

// ========== 主循环 ==========
bestEl.textContent = best;
let last = performance.now(), acc = 0;
let lastFrameT = 0;
function loop(t) {
  // Background tab detection: skip large dt gaps
  let dt = (t - last) / 1000;
  last = t;
  if (dt > 0.5) { dt = 0; acc = 0; } // tab was hidden, skip
  dt = Math.min(dt, 0.05);

  if (!started) { requestAnimationFrame(loop); return; }
  // 播广告 / 弹道具商店时冻结世界：绝不能让玩家在看广告时被判死
  if ((typeof adPaused !== 'undefined' && adPaused) || (typeof sheetOpen !== 'undefined' && sheetOpen) || (typeof shareOpen !== 'undefined' && shareOpen)) { acc = 0; draw(); requestAnimationFrame(loop); return; }
  if (hitstop > 0) { hitstop -= dt; draw(); requestAnimationFrame(loop); return; }
  acc += dt * (slowmo > 0 ? 0.4 : 1);
  let steps = 0;
  while (acc >= STEP && steps < 6) { step(STEP); acc -= STEP; steps++; }
  if (steps === 6) acc = 0;
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ========== 阶段G · 道具系统 ==========
// 金币 & 背包持久化（localStorage）；道具：撤销/炸弹/换果。
// 设计意图：金币是后续变现（阶段H 看广告得币、阶段I 签到/任务、皮肤消费）的统一货币。
const STORE_KEY_COINS = 'suikaCoins';
const STORE_KEY_INV   = 'suikaInv';
let coins = +(localStorage.getItem(STORE_KEY_COINS) || 0);
let inv = (function () {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY_INV));
    if (raw && typeof raw === 'object') {
      return { undo: raw.undo | 0, bomb: raw.bomb | 0, swap: raw.swap | 0 };
    }
  } catch (e) {}
  return { undo: 1, bomb: 1, swap: 1 };   // 新玩家赠送各 1 个，先尝到甜头
})();
function saveWallet() {
  try {
    localStorage.setItem(STORE_KEY_COINS, coins);
    localStorage.setItem(STORE_KEY_INV, JSON.stringify(inv));
  } catch (e) {}
}
function earnCoins(n) { coins += n; saveWallet(); updateItemBar(); if (typeof questBump === 'function') questBump('coin', n); }

// 道具定义（cost = 金币直购价，阶段H/I 会用到）
const ITEMS = {
  undo: { cost: 60, emoji: '↩️', name: '撤销' },
  bomb: { cost: 40, emoji: '💣', name: '炸弹' },
  swap: { cost: 30, emoji: '🔀', name: '换果' },
};

// ---------- 撤销：落果前快照 ----------
let undoSnapshot = null;
function takeSnapshot() {
  undoSnapshot = {
    balls: balls.map(b => Object.assign({}, b)),
    score: score, merges: merges, combo: combo, lastMergeAt: lastMergeAt,
    pending: pending ? Object.assign({}, pending) : null,
    nextLevel: nextLevel, nextGolden: nextGolden,
    dangerTimer: dangerTimer, dropCd: dropCd,
    seenLevels: seenLevels.slice(),
    coinBase: _lastScoreForCoins,
  };
}
function applySnapshot(s) {
  balls = s.balls.map(b => Object.assign({}, b));
  score = s.score; merges = s.merges; combo = s.combo; lastMergeAt = s.lastMergeAt;
  pending = s.pending ? Object.assign({}, s.pending) : null;
  nextLevel = s.nextLevel; nextGolden = s.nextGolden;
  dangerTimer = s.dangerTimer; dropCd = s.dropCd;
  seenLevels = s.seenLevels.slice();
  _lastScoreForCoins = s.coinBase;   // 防止撤销后重复领取金币
  particles = []; popups = []; rings = [];
  banner = null; shake = 0; flash = 0; hitstop = 0; slowmo = 0;
  nextEl.textContent = (nextGolden ? '✨' : '') + FRUITS[nextLevel - 1].emoji;
  updateScore();
}
function useUndo() {
  if (inv.undo <= 0 || !undoSnapshot || gameOver) return false;
  inv.undo--;
  // 防刷：撤销回滚分数，则该段分数已发放的「里程碑金币」必须同步收回，
  // 否则「落果→撤销」可无限循环造币。只回收里程碑币，不动广告/签到等其他来源。
  const minted = Math.floor(score / 50) - Math.floor(undoSnapshot.coinBase / 50);
  if (minted > 0) {
    coins = Math.max(0, coins - minted);
    if (typeof runCoins === 'number') runCoins = Math.max(0, runCoins - minted);
  }
  saveWallet();
  applySnapshot(undoSnapshot);
  undoSnapshot = null;                       // 一次快照只可用一次
  popup(I18N.t('undo_popup'), W / 2, DANGER + 90, '#c4b5fd', 26);
  ring(W / 2, DANGER + 90, '#a78bfa', 90);
  flash = Math.max(flash, 0.14);
  updateItemBar();
  if (typeof questBump === 'function') questBump('item', 1);
  return true;
}

// ---------- 炸弹：点选一个果子消除 ----------
let bombArmed = false;
const bombHintEl = document.getElementById('bombHint');
const btnBombEl  = document.getElementById('btnBomb');
function setBombArmed(v) {
  bombArmed = v;
  bombHintEl.style.display = v ? 'block' : 'none';
  btnBombEl.classList.toggle('armed', v);
}
function armBomb() {
  if (gameOver) return false;
  if (!bombArmed && inv.bomb <= 0) return false;
  setBombArmed(!bombArmed);
  updateItemBar();
  return true;
}
function executeBomb(x, y) {
  let target = null, closest = Infinity;
  for (const b of balls) {
    if (!b.released || b.expired) continue;
    const d = Math.hypot(b.x - x, b.y - y);
    if (d < b.r * 1.35 && d < closest) { closest = d; target = b; }
  }
  if (!target) return false;
  inv.bomb--; saveWallet();
  setBombArmed(false);
  const f = FRUITS[target.level - 1];
  burst(target.x, target.y, f.color, 12 + target.level);
  burst(target.x, target.y, '#ff9a6b', 8);
  ring(target.x, target.y, '#ff6a4a', target.r * 2.8);
  popup('💣', target.x, target.y - 14, '#ff8a5a', 24);
  shake = Math.max(shake, 0.3);
  hitstop = Math.max(hitstop, 0.03);
  removeBall(target);
  // 唤醒周围睡眠球，让堆叠自然塌落（这是「炸弹救场」的核心手感）
  for (const o of balls) {
    if (o.sleeping && Math.hypot(o.x - target.x, o.y - target.y) < target.r * 3 + o.r) {
      o.sleeping = false; o.rest = 0;
    }
  }
  updateItemBar();
  if (typeof questBump === 'function') questBump('item', 1);
  return true;
}

// ---------- 换果：重掷预备果 ----------
function useSwap() {
  if (inv.swap <= 0 || !pending || gameOver) return false;
  inv.swap--; saveWallet();
  const old = pending.level;
  let lv = randLevel();
  for (let i = 0; i < 6 && lv === old; i++) lv = randLevel();  // 尽量换到不同的

}

// 炸弹瞄准态下拦截 canvas 抬手：消除目标而不是落果。
// capture 阶段 + stopImmediatePropagation 才能压住同元素上已注册的落果 handler。
canvas.addEventListener('pointerup', function (e) {
  if (!bombArmed) return;

  const ly = (e.clientY - rect.top)  / rect.height * H;

// ========== 阶段H · 广告变现（Provider 抽象 + 三个激励入口） ==========
// 商业化红线（同时满足 Adsgram / 微信小游戏 / 纯 H5 三端审核）：
//   1) 广告只在玩家主动点按后播放，绝不自动弹、绝不强制；
//   2) 不看广告游戏功能完整 —— 金币靠分数产出，道具可用金币购买；
//   3) 按钮文案明写「看广告」，玩家知情后才点。
// 渠道抽象成 provider：adsgram(Telegram) / mock(本地&H5 预览) / instant(自动化测试)。
// 换渠道只需换 provider，业务层（复活 / 领道具 / 金币翻倍）一行都不用改。
const AD_CONFIG = {
  provider: 'auto',        // 'auto' | 'adsgram' | 'mock' | 'instant' | 'none'
  adsgramBlockId: DEPLOY.adsgramBlockId,   // 值来自顶部 DEPLOY.adsgramBlockId；留空自动降级为本地模拟
  minGapSec: 8,            // 两次激励广告最小间隔，挡连点/防刷
  dailyCap: 25,            // 单日上限，保护体验也保护账号
  revivePerRun: 1,         // 每局最多复活次数（>1 会摧毁分数体系的可信度）
  mockSec: 3,              // 模拟广告时长
};

// ---------- Telegram 宿主接入（不在 TG 内时全部安静跳过） ----------
const TG = (typeof window !== 'undefined' && window.Telegram && window.Telegram.WebApp) || null;
if (TG) {
  try {
    TG.ready();
    TG.expand();
    if (TG.disableVerticalSwipes) TG.disableVerticalSwipes();   // 防止下拉手势把小程序拖走
  } catch (e) {}
  // 部署期自查：TG 环境就绪但广告位没填 → 提示，别让假广告悄悄上线
  if (!AD_CONFIG.adsgramBlockId) {
    console.warn('[suika] 已在 Telegram 内运行，但 DEPLOY.adsgramBlockId 为空：广告将走本地模拟（无收入）。上线前到 adsgram.ai 创建广告位并填入顶部 DEPLOY 配置。');
  }
}
function haptic(kind) {
  if (!TG || !TG.HapticFeedback) return;
  try { TG.HapticFeedback.impactOccurred(kind || 'light'); } catch (e) {}
}
function hapticNotify(kind) {
  if (!TG || !TG.HapticFeedback) return;
  try { TG.HapticFeedback.notificationOccurred(kind || 'success'); } catch (e) {}
}

// ---------- 埋点占位（阶段J 接真实上报，这里先本地留痕，便于测试断言） ----------
function track(ev, params) {
  const rec = Object.assign({ ev: ev, t: Date.now() }, params || {});
  (window.__events = window.__events || []).push(rec);
  return rec;
}

// ---------- 频次闸门（跨天重置，落 localStorage） ----------
const STORE_KEY_AD = 'suikaAd';
let adState = (function () {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY_AD));
    if (raw && typeof raw === 'object') return { day: raw.day || '', count: raw.count | 0, lastAt: 0 };
  } catch (e) {}
  return { day: '', count: 0, lastAt: 0 };
})();
function todayKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function adRollDay() {
  const k = todayKey();
  if (adState.day !== k) { adState.day = k; adState.count = 0; saveAdState(); }
}
function saveAdState() {
  try { localStorage.setItem(STORE_KEY_AD, JSON.stringify({ day: adState.day, count: adState.count })); } catch (e) {}
}
function adGate() {
  adRollDay();
  if (adState.count >= AD_CONFIG.dailyCap) return 'cap';
  if (Date.now() - adState.lastAt < AD_CONFIG.minGapSec * 1000) return 'cool';
  return 'ok';
}

// ---------- Provider ----------
function adProviderName() {
  if (AD_CONFIG.provider !== 'auto') return AD_CONFIG.provider;
  if (AD_CONFIG.adsgramBlockId && window.Adsgram && typeof window.Adsgram.init === 'function') return 'adsgram';
  return 'mock';
}
let _adsgramCtl = null;
function adsgramPlay(done) {
  try {
    if (!_adsgramCtl) _adsgramCtl = window.Adsgram.init({ blockId: AD_CONFIG.adsgramBlockId });
    _adsgramCtl.show()
      .then(() => done('ok'))
      .catch(err => {
        const d = (err && (err.description || err.message) || '').toLowerCase();
        done(d.indexOf('no ad') >= 0 ? 'noads' : 'fail');
      });
  } catch (e) { done('fail'); }
}
// 本地模拟：全屏遮罩 + 进度条，跑完才算完成（和激励视频语义一致）
const adVeilEl = document.getElementById('adVeil');
const adVeilBar = document.getElementById('adVeilBar');
const adVeilLbl = document.getElementById('adVeilLbl');
function mockPlay(done) {
  const dur = AD_CONFIG.mockSec * 1000;
  const t0 = Date.now();
  adVeilEl.classList.add('on');
  (function tick() {
    const p = Math.min(1, (Date.now() - t0) / dur);
    adVeilBar.style.width = (p * 100).toFixed(1) + '%';
    adVeilLbl.textContent = p < 1 ? ('广告播放中… ' + Math.ceil((1 - p) * AD_CONFIG.mockSec) + 's') : '完成';
    if (p < 1) { requestAnimationFrame(tick); return; }
    adVeilEl.classList.remove('on');
    adVeilBar.style.width = '0%';
    done('ok');
  })();
}

// ---------- 统一入口：showRewarded(placement, cb) ----------
// cb(result) 的 result ∈ 'ok' | 'fail' | 'noads' | 'cap' | 'cool' | 'busy'
let adPaused = false;   // 播广告 / 弹商店时暂停世界（loop 里读它）
let adBusy = false;
function showRewarded(placement, cb) {
  cb = cb || function () {};
  if (adBusy) { cb('busy'); return; }
  const gate = adGate();
  if (gate !== 'ok') {
    track('ad_blocked', { placement: placement, reason: gate });
    adToast(gate === 'cap' ? '今日广告次数已用完，明天再来' : '刚看过啦，稍等几秒');
    cb(gate);
    return;
  }
  const provider = adProviderName();
  adBusy = true; adPaused = true;
  track('ad_start', { placement: placement, provider: provider });
  const finish = res => {
    adBusy = false; adPaused = false;
    if (res === 'ok') {
      adState.count++; adState.lastAt = Date.now(); saveAdState();
      hapticNotify('success');
    } else {
      adToast(res === 'noads' ? '暂时没有可播的广告' : '广告加载失败，稍后再试');
    }
    track('ad_end', { placement: placement, provider: provider, result: res });
    cb(res);
  };
  if (provider === 'adsgram') adsgramPlay(finish);
  else if (provider === 'instant') finish('ok');       // 自动化测试用：同步完成
  else if (provider === 'none') finish('fail');
  else mockPlay(finish);
}

// ---------- 入口①：看广告复活（价值最高，放在结算页首位） ----------
let reviveUsed = 0;
function canRevive() { return gameOver && reviveUsed < AD_CONFIG.revivePerRun && score > 0; }
function doRevive() {
  if (!gameOver || reviveUsed >= AD_CONFIG.revivePerRun) return;   // 二道闸：防重复/防非结算态触发
  // 清掉压在警戒线附近的一批果子腾出空间 —— 复活必须真的「救得回来」，
  // 否则玩家复活后 2 秒又死，会觉得广告是骗人的，从此再不点。
  const sorted = balls.filter(b => b.released && !b.expired).sort((a, b) => (a.y - a.r) - (b.y - b.r));
  let victims = sorted.filter(b => b.y - b.r < DANGER + 170);
  if (victims.length < 3) victims = sorted.slice(0, 3);
  if (victims.length > 9) victims = victims.slice(0, 9);
  for (const b of victims) {
    const f = FRUITS[b.level - 1];
    burst(b.x, b.y, f.color, 10 + b.level);
    ring(b.x, b.y, '#7bffa8', b.r * 2.6);
    removeBall(b);
  }
  for (const b of balls) { b.sleeping = false; b.rest = 0; }   // 让堆叠自然塌落
  reviveUsed++;
  gameOver = false;
  dangerTimer = 0;
  dropCd = 0.35;
  overlay.classList.add('hidden');
  if (!pending) newPending();
  undoSnapshot = null;
  banner = { text: I18N.t('revive_banner'), life: 1.4 };
  shake = Math.max(shake, 0.45);
  flash = Math.max(flash, 0.3);
  updateItemBar();
  track('revive_done', { score: score, cleared: victims.length });
  return victims.length;
}

// 就地改写 FRUITS 的 emoji/color —— 所有绘制代码都读 FRUITS，无需改动一行渲染逻辑

  skinState.cur = id;
  saveSkin();
  if (typeof updateScore === 'function') updateScore();
  return true;
}
function ownSkin(id) { return skinState.owned.indexOf(id) >= 0; }
function grantSkin(id) {
  if (!SKIN_BY_ID[id] || ownSkin(id)) return false;
  skinState.owned.push(id);
  saveSkin();
  track('skin_unlock', { id: id });

}
function buySkin(id) {

  coins -= sk.cost;
  saveWallet();
  updateItemBar();

}
function equipSkin(id) {

// ---------- 每日签到 ----------
// 7 天一轮，第 7 天给限定皮肤 —— 断签回到第 1 天，这是留存的核心压力来源。
const CHECKIN = [
  { d: 1, kind: 'coins', n: 20,  ico: '💰', lbl: '20 金币' },
  { d: 2, kind: 'undo',  n: 1,   ico: '↩️', lbl: '撤销 ×1' },
  { d: 3, kind: 'coins', n: 40,  ico: '💰', lbl: '40 金币' },
  { d: 4, kind: 'bomb',  n: 1,   ico: '💣', lbl: '炸弹 ×1' },
  { d: 5, kind: 'coins', n: 70,  ico: '💰', lbl: '70 金币' },
  { d: 6, kind: 'swap',  n: 1,   ico: '🔀', lbl: '换果 ×1' },
  { d: 7, kind: 'skin',  n: 0,   ico: '🪐', lbl: '星际皮肤' },
];
const STORE_KEY_DAILY = 'suikaDaily';
function dayNum(d) {   // 以本地日为单位的整数天号，用于判断"昨天"
  const t = d || new Date();
  return Math.floor((t - t.getTimezoneOffset() * 60000) / 86400000);
}
let dailyState = (function () {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY_DAILY));
    if (raw && typeof raw === 'object') {
      return { last: raw.last | 0, streak: raw.streak | 0, doubled: !!raw.doubled };
    }
  } catch (e) {}
  return { last: 0, streak: 0, doubled: false };
})();
function saveDaily() {
  try { localStorage.setItem(STORE_KEY_DAILY, JSON.stringify(dailyState)); } catch (e) {}
}
function checkinClaimedToday() { return dailyState.last === dayNum(); }
// 今天该签第几天（1..7）：连着签就往后走，断了从 1 开始
function checkinSlot() {
  if (checkinClaimedToday()) return ((dailyState.streak - 1) % 7) + 1;
  const cont = dailyState.last === dayNum() - 1;
  const next = cont ? dailyState.streak + 1 : 1;
  return ((next - 1) % 7) + 1;
}
function grantReward(kind, n) {
  if (kind === 'coins') { earnCoins(n); return n + ' 💰'; }
  if (kind === 'skin')  { grantSkin('cosmos'); return '🪐 星际皮肤'; }
  inv[kind] = (inv[kind] | 0) + n;
  saveWallet(); updateItemBar();
  return (ITEMS[kind] ? ITEMS[kind].ico : '') + ' ×' + n;
}
function doCheckin() {
  if (checkinClaimedToday()) return false;
  const cont = dailyState.last === dayNum() - 1;
  dailyState.streak = cont ? dailyState.streak + 1 : 1;
  dailyState.last = dayNum();
  dailyState.doubled = false;
  saveDaily();
  const slot = ((dailyState.streak - 1) % 7) + 1;
  const r = CHECKIN[slot - 1];
  const txt = grantReward(r.kind, r.n);
  hapticNotify('success');
  adToast(I18N.t('toast_checkin_ok').replace('{t}', txt));
  track('checkin', { day: slot, streak: dailyState.streak, kind: r.kind });
  renderSheet();
  updateMenuDots();
  return true;
}
function canDoubleCheckin() {
  if (!checkinClaimedToday() || dailyState.doubled) return false;
  const slot = ((dailyState.streak - 1) % 7) + 1;
  return CHECKIN[slot - 1].kind !== 'skin';   // 皮肤没法翻倍
}
function doubleCheckin() {
  if (!canDoubleCheckin()) return false;
  dailyState.doubled = true;
  saveDaily();
  const slot = ((dailyState.streak - 1) % 7) + 1;
  const r = CHECKIN[slot - 1];
  const txt = grantReward(r.kind, r.n);
  adToast(I18N.t('toast_double_ok').replace('{t}', txt));
  track('checkin_double', { day: slot });
  renderSheet();
  return true;
}

// ---------- 每日任务 ----------
// 用日期做种子确定性抽 3 个，避免刷新页面换题；跨天自动重置。
const QUEST_POOL = [
  { id: 'play',  type: 'play',  need: 3,   ico: '🎮', lbl: '完成 3 局游戏',    reward: 25 },
  { id: 'merge', type: 'merge', need: 30,  ico: '🔗', lbl: '累计合成 30 次',   reward: 25 },
  { id: 'score', type: 'score', need: 800, ico: '🎯', lbl: '单局得分达到 800', reward: 30 },
  { id: 'lv6',   type: 'level', need: 6,   ico: '🍅', lbl: '合成出第 6 级果',  reward: 30 },
  { id: 'lv8',   type: 'level', need: 8,   ico: '🍍', lbl: '合成出第 8 级果',  reward: 40 },
  { id: 'item',  type: 'item',  need: 2,   ico: '🧰', lbl: '使用道具 2 次',    reward: 20 },
  { id: 'combo', type: 'combo', need: 3,   ico: '⚡', lbl: '打出 3 连击',      reward: 25 },
  { id: 'coin',  type: 'coin',  need: 60,  ico: '💰', lbl: '今日赚 60 金币',   reward: 25 },
];
const QUEST_BONUS = 60;   // 三题全清的额外宝箱
const STORE_KEY_QUEST = 'suikaQuest';
let questState = null;
function questPick(day) {
  // xorshift(day) 定序洗牌，取前 3
  let s = (day * 2654435761) >>> 0;
  const rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  const pool = QUEST_POOL.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  return pool.slice(0, 3).map(q => ({ id: q.id, prog: 0, claimed: false }));
}
function questLoad() {
  const day = dayNum();
  let st = null;
  try { st = JSON.parse(localStorage.getItem(STORE_KEY_QUEST)); } catch (e) {}
  if (!st || st.day !== day || !Array.isArray(st.q) || st.q.length !== 3) {
    st = { day: day, q: questPick(day), bonus: false };
  }
  questState = st;
  questSave();
}
function questSave() {
  try { localStorage.setItem(STORE_KEY_QUEST, JSON.stringify(questState)); } catch (e) {}
}
function questRollDay() { if (!questState || questState.day !== dayNum()) questLoad(); }
function questDef(id) { for (const q of QUEST_POOL) if (q.id === id) return q; return null; }
function questDone(rec) { const d = questDef(rec.id); return d && rec.prog >= d.need; }
function questAllDone() { return questState.q.every(questDone); }
// 累加型进度（play/merge/item/coin）
function questBump(type, n) {
  questRollDay();
  let hit = false;
  for (const rec of questState.q) {
    const d = questDef(rec.id);
    if (!d || d.type !== type || rec.claimed) continue;
    if (questDone(rec)) continue;
    rec.prog += (n || 1);
    hit = true;
    if (questDone(rec)) { adToast(d.ico + ' 任务完成 · 可领 ' + d.reward + '💰'); hapticNotify('success'); }
  }
  if (hit) { questSave(); updateMenuDots(); }
}
// 峰值型进度（score/level/combo）：取本日最大值
function questPeak(type, v) {
  questRollDay();
  let hit = false;
  for (const rec of questState.q) {
    const d = questDef(rec.id);
    if (!d || d.type !== type || rec.claimed) continue;
    if (questDone(rec)) continue;
    if (v > rec.prog) { rec.prog = v; hit = true; }
    if (questDone(rec)) { adToast(d.ico + ' 任务完成 · 可领 ' + d.reward + '💰'); hapticNotify('success'); }
  }
  if (hit) { questSave(); updateMenuDots(); }
}
function questClaim(id) {
  questRollDay();
  const rec = questState.q.filter(r => r.id === id)[0];
  if (!rec || rec.claimed || !questDone(rec)) return false;
  const d = questDef(id);
  rec.claimed = true;
  questSave();
  earnCoins(d.reward);
  hapticNotify('success');
  adToast('+' + d.reward + ' 💰');
  track('quest_claim', { id: id, reward: d.reward });
  renderSheet();
  updateMenuDots();
  return true;
}
function questBonusReady() { questRollDay(); return !questState.bonus && questState.q.every(r => r.claimed); }
function questClaimBonus() {
  if (!questBonusReady()) return false;
  questState.bonus = true;
  questSave();
  earnCoins(QUEST_BONUS);
  hapticNotify('success');
  adToast(I18N.t('toast_quest_bonus').replace('{n}', QUEST_BONUS));
  track('quest_bonus', { reward: QUEST_BONUS });
  renderSheet();
  updateMenuDots();
  return true;
}
function questClaimable() {
  questRollDay();
  let n = 0;
  for (const rec of questState.q) if (!rec.claimed && questDone(rec)) n++;
  if (questBonusReady()) n++;
  return n;
}

// ========== 阶段J · 病毒传播 + 埋点 + 新手引导 ==========
// 三件事，一条主线：让新玩家 30 秒内学会（引导）→ 玩爽了愿意晒（分享卡）→
// 每一步都留下可回捞的数据（埋点）。任何一环缺失，买量/自然流都算不出账。
const SHARE = {
  // 深链统一取自顶部 DEPLOY.botLink（替换 bot 只需改那一处）
  link: DEPLOY.botLink,
  // 展示名不在此写死：分享卡片/文案统一从 I18N 按当前语言取（zh=合成大西瓜 / en=Merge Melon）
  dailyReward: 30,        // 每日首次分享的金币奖励（只给一次，防刷）
  cardW: 900, cardH: 1200,
};
const TELEMETRY = {
  endpoint: '',           // 填后端 URL 即开始真实上报；留空 = 只在本地留痕（当前发布态）
  batch: 12,              // 攒够多少条发一次，省电省流量
  maxQueue: 200,          // 离线兜底上限，超了丢最旧的
  appVer: 'j1',
};

// ---------- 身份与会话（无后端也能拼出留存/漏斗） ----------
function tmUid() {
  try {
    if (TG && TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.id) {
      return 'tg' + TG.initDataUnsafe.user.id;
    }
  } catch (e) {}
  try {
    let u = localStorage.getItem('suikaUid');
    if (!u) {
      u = 'w' + Date.now().toString(36) + Math.floor(Math.random() * 1679616).toString(36);
      localStorage.setItem('suikaUid', u);
    }
    return u;
  } catch (e) {}
  return 'anon';
}
const TM_UID = tmUid();
const TM_SID = 's' + Date.now().toString(36) + Math.floor(Math.random() * 46656).toString(36);
const TM_T0 = Date.now();
let tmSeq = 0, tmQueue = [], tmSent = 0, tmDropped = 0, tmFlushes = 0, tmLastPayload = null;

function tmEnqueue(rec) {
  rec.sid = TM_SID; rec.uid = TM_UID; rec.v = TELEMETRY.appVer;
  rec.n = ++tmSeq; rec.rt = Date.now() - TM_T0;      // 相对开机毫秒，做漏斗时序
  tmQueue.push(rec);
  if (tmQueue.length > TELEMETRY.maxQueue) {
    tmDropped += tmQueue.length - TELEMETRY.maxQueue;
    tmQueue.splice(0, tmQueue.length - TELEMETRY.maxQueue);
  }
  if (tmQueue.length >= TELEMETRY.batch) tmFlush('batch');
  return rec;
}
function tmFlush(reason) {
  const n = tmQueue.length;
  if (!n) return 0;
  const payload = {
    app: 'suika', v: TELEMETRY.appVer, sid: TM_SID, uid: TM_UID,
    reason: reason || 'manual', ts: Date.now(), events: tmQueue.slice(),
  };
  tmQueue.length = 0;
  tmFlushes++; tmSent += n;
  tmLastPayload = payload;
  if (!TELEMETRY.endpoint) return n;      // 无后端：只在内存留痕，绝不发请求
  const body = JSON.stringify(payload);
  try {
    if (typeof navigator !== 'undefined' && navigator.sendBeacon) {
      navigator.sendBeacon(TELEMETRY.endpoint, body);
      return n;
    }
  } catch (e) {}
  try {
    if (typeof fetch === 'function') {
      fetch(TELEMETRY.endpoint, { method: 'POST', body: body, keepalive: true,

function drawShareCard() {
  const c = document.createElement('canvas');
  if (!c || typeof c.getContext !== 'function') return null;
  const W2 = SHARE.cardW, H2 = SHARE.cardH;
  c.width = W2; c.height = H2;

  if (!g) return null;
  const sc = score, pk = peakLevel() || 1, f = FRUITS[pk - 1];

  // 背景：和游戏内同一套色，认得出是同一个产品

  bg.addColorStop(0, '#123024'); bg.addColorStop(0.55, '#0d2a2a'); bg.addColorStop(1, '#101b2e');
  g.fillStyle = bg; g.fillRect(0, 0, W2, H2);
  // 果子剪影做底纹
  for (let i = 0; i < 14; i++) {
    const fr = FRUITS[(i * 3) % 11];
    const x = ((i * 173) % (W2 - 120)) + 60, y = ((i * 311) % (H2 - 200)) + 100, r = 40 + (i % 5) * 26;
    g.globalAlpha = 0.06; g.fillStyle = fr.color;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;

  g.textAlign = 'center';
  g.fillStyle = 'rgba(255,255,255,0.72)';
  g.font = '600 40px system-ui,-apple-system,sans-serif';
  g.fillText('🍉 ' + I18N.t('title'), W2 / 2, 110);

  // 主视觉：本局最大果 + 光晕
  const cy = 400;
  const halo = g.createRadialGradient(W2 / 2, cy, 10, W2 / 2, cy, 250);
  halo.addColorStop(0, f.color); halo.addColorStop(1, 'rgba(0,0,0,0)');
  g.globalAlpha = 0.5; g.fillStyle = halo;
  g.beginPath(); g.arc(W2 / 2, cy, 250, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 1;
  g.font = '260px system-ui,-apple-system,"Apple Color Emoji",sans-serif';
  g.textBaseline = 'middle';
  g.fillText(f.emoji, W2 / 2, cy);

  // 分数：卡片上唯一的大数字，一眼可比
  g.fillStyle = '#ffffff';

  g.fillText(String(sc), W2 / 2, 780);
  g.fillStyle = 'rgba(255,255,255,0.55)';
  g.font = '600 38px system-ui,-apple-system,sans-serif';

  const cells = [
    [I18N.t('final_peak'), f.name],
    [I18N.t('final_merges_prefix'), merges + (I18N.t('final_times') ? ' ' + I18N.t('final_times') : '')],
    [I18N.t('final_best'), String(best)]
  ];
  const bw = 250, gap = 26, tot = bw * 3 + gap * 2, bx = (W2 - tot) / 2, by = 880;
  for (let i = 0; i < 3; i++) {
    const x = bx + i * (bw + gap);
    g.fillStyle = 'rgba(255,255,255,0.07)';

    if (g.roundRect) { g.roundRect(x, by, bw, 130, 24); } else { g.rect(x, by, bw, 130); }
    g.fill();
    g.fillStyle = 'rgba(255,255,255,0.5)';
    g.font = '500 30px system-ui,-apple-system,sans-serif';
    g.fillText(cells[i][0], x + bw / 2, by + 50);
    g.fillStyle = '#fff';
    g.font = '700 44px system-ui,-apple-system,sans-serif';
    g.fillText(cells[i][1], x + bw / 2, by + 104);
  }

  g.font = '700 46px system-ui,-apple-system,sans-serif';
  g.fillText(shareTagline(sc, pk), W2 / 2, 1090);

}

// ========== 阶段K · 手感打磨（combo 徽章 + 慢镜 + 金币飞入 + HUD 脉冲） ==========
// 原则：全部追加式改造，一行都不动 doMerge/step/draw 的原有逻辑。
// 靠三招把「合成」这个动作的爽感拉满：
//  ① 屏幕视觉：combo 徽章从空中砸下来，越连击越大越金；
//  ② 时间感：大果（≥8 级）出现瞬间进 slow-mo，玩家看得清「我合成了什么」；
//  ③ 因果链：合并→金币飞进 HUD→数字跳动，一条金光把奖励串起来，视觉负债结清。

// ---- 状态 ----
const KJ = {
  badge: null,                 // { count, life, maxLife, scale, hue }
  coinFlies: [],               // { x, y, tx, ty, life, maxLife, val, seed }
  hudPulse: 0,                 // 分数脉冲 0..1
  coinPulse: 0,                // 金币脉冲 0..1
  lastCoinsShown: coins,       // 用于探测 earnCoins 后差值
};

// ---- 目标坐标：#coinCount 在屏幕上的位置 → 逻辑坐标 ----
function coinTargetLogical() {
  const r = coinCountEl && coinCountEl.getBoundingClientRect ? coinCountEl.getBoundingClientRect() : null;
  const gr = canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : null;
  if (!r || !gr || !gr.width) return { x: 40, y: GROUND + 40 };
  const cx = (r.left + r.width / 2 - gr.left) / gr.width * W;
  const cy = (r.top + r.height / 2 - gr.top) / gr.width * W;   // 用 W 做等比换算最稳
  return { x: cx, y: cy };
}

function spawnCoinFly(x, y, n) {
  if (!(n > 0)) return;
  // 一次最多飞 8 颗，避免刷屏；数额显示在最后一颗
  const cnt = Math.min(8, Math.max(1, Math.round(Math.log2(n + 1) + 1)));
  const t = coinTargetLogical();
  for (let i = 0; i < cnt; i++) {
    KJ.coinFlies.push({
      x: x + (Math.random() - 0.5) * 20,
      y: y + (Math.random() - 0.5) * 12,
      tx: t.x, ty: t.y,
      life: 0.62 + i * 0.05, maxLife: 0.62 + i * 0.05,
      val: (i === cnt - 1) ? n : 0,
      seed: Math.random() * 6.28,
    });
  }
}

// ---- 合并瞬间的手感注入（doMerge 内部已 hook：onMergeJuice） ----
function onMergeJuice(nx, ny, level, cmb, gain, isJackpot) {
  // combo 徽章：≥2 就出，越大越猛
  if (cmb >= 2) {
    const boost = Math.min(cmb, 12);
    KJ.badge = {
      count: cmb,
      life: 0.9 + boost * 0.04,
      maxLife: 0.9 + boost * 0.04,
      hue: cmb >= 6 ? 42 : (cmb >= 4 ? 48 : 52),
    };
  }
  // 大果高光：靠 hitstop 冻帧 + flash 白闪，不用 slowmo（slowmo 会让物理子步数掉，可能穿模）。
  // 11 级最长（西瓜是本局最高光），10 级次之，8/9 级给一点点即可。
  if (level === 11) {
    hitstop = Math.max(hitstop, 0.32);
    flash = Math.max(flash, 0.45);
  } else if (level >= 10) {
    hitstop = Math.max(hitstop, 0.18);
    flash = Math.max(flash, 0.35);
  } else if (level >= 8) {
    hitstop = Math.max(hitstop, 0.10);
    flash = Math.max(flash, 0.28);
  }
  if (level >= 8) {
    // 二段冲击环，视觉上「响得更久」
    ring(nx, ny, lighten(FRUITS[level - 1].color, 0.4), radius(level) * 3.2);
    burst(nx, ny, '#ffffff', 10);
  }
  // 3 连及以上，加一圈金光扩散
  if (cmb >= 3) {
    ring(nx, ny, '#ffe08a', radius(level) * 2.2);
    burst(nx, ny, '#ffd76a', 6 + cmb);
  }
  // 得分越大越震（配合已有 hitstop / shake，多给一点点，但不越权）
  if (gain >= 60) shake = Math.max(shake, 0.32);
  if (isJackpot || level === 11) shake = Math.max(shake, 0.7);
  // 触发 HUD 分数脉冲（比 CSS 动画更可控）
  KJ.hudPulse = 1;
}

// ---- 分数产出金币时飞一次 ----
const _origCheckScoreReward = typeof checkScoreReward === 'function' ? checkScoreReward : null;
if (_origCheckScoreReward) {
  const before = () => Math.floor(score / 50) - Math.floor(_lastScoreForCoins / 50);
  checkScoreReward = function () {
    const g = before();
    _origCheckScoreReward();
    if (g > 0) {
      // 从上次合并点或屏幕右上（HUD 附近）向金币计数器飞
      const b = balls.length ? balls[balls.length - 1] : null;
      const sx = b ? b.x : (W - 46), sy = b ? b.y : (DANGER + 20);
      spawnCoinFly(sx, sy, g);
    }
