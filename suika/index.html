}

// ---- 金币计数变化时也脉冲一下（签到 / 任务 / 分享领奖也能看到反馈） ----
const _origEarnCoins = earnCoins;
earnCoins = function (n) {
  const before = coins;
  _origEarnCoins(n);
  if (coins > before) KJ.coinPulse = 1;
};

// ---- 每帧更新（不改 step，用 rAF 兜底一层） ----
function updateJuice(dt) {
  if (KJ.badge) { KJ.badge.life -= dt; if (KJ.badge.life <= 0) KJ.badge = null; }
  KJ.hudPulse = Math.max(0, KJ.hudPulse - dt * 3);
  KJ.coinPulse = Math.max(0, KJ.coinPulse - dt * 3);
  const arr = KJ.coinFlies;
  for (let i = arr.length - 1; i >= 0; i--) {
    const c = arr[i];
    c.life -= dt;
    if (c.life <= 0) { arr.splice(i, 1); continue; }
    const t = 1 - (c.life / c.maxLife);
    // 二次贝塞尔弧线 + 侧向摆动，视觉上像金币在跳
    const ct = Math.sin(c.seed + t * 6) * 6 * (1 - t);
    c.x = c.x + (c.tx - c.x) * (dt * 4.6 + 0.02);
    c.y = c.y + (c.ty - c.y) * (dt * 4.6 + 0.02) - 40 * dt * (1 - t) + ct * dt;
  }
}

function drawJuice() {
  // combo 徽章
  if (KJ.badge) {
    const b = KJ.badge;
    const p = 1 - b.life / b.maxLife;
    // 弹性缩放：0.2 -> 1.15 -> 1.0
    const s = p < 0.18 ? 0.2 + p / 0.18 * 0.95 : (p < 0.34 ? 1.15 - (p - 0.18) / 0.16 * 0.15 : 1.0);
    const alpha = p > 0.75 ? Math.max(0, 1 - (p - 0.75) / 0.25) : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(W / 2, 118);
    ctx.scale(s, s);
    // 光晕
    const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 90);
    glow.addColorStop(0, `hsla(${b.hue},100%,70%,0.85)`);
    glow.addColorStop(1, `hsla(${b.hue},100%,50%,0)`);
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0, 0, 90, 0, Math.PI * 2); ctx.fill();
    // 主体文字
    ctx.fillStyle = `hsl(${b.hue},100%,88%)`;
    ctx.font = 'bold 22px "PingFang SC",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('COMBO', 0, -14);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + (44 + Math.min(b.count, 10) * 2) + 'px "PingFang SC",sans-serif';
    ctx.shadowColor = `hsla(${b.hue},100%,60%,0.8)`; ctx.shadowBlur = 12;
    ctx.fillText('×' + b.count, 0, 18);
    ctx.restore();
  }
  // 金币飞入
  for (const c of KJ.coinFlies) {
    ctx.save();
    const a = Math.min(1, c.life / c.maxLife * 1.5);
    ctx.globalAlpha = a;
    // 金光尾巴
    ctx.fillStyle = 'rgba(255,224,138,0.35)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, 10, 0, Math.PI * 2); ctx.fill();
    // 硬币本体
    const gd = ctx.createRadialGradient(c.x - 2, c.y - 2, 1, c.x, c.y, 8);
    gd.addColorStop(0, '#fff6c9'); gd.addColorStop(0.6, '#ffd54a'); gd.addColorStop(1, '#c98a1a');
    ctx.fillStyle = gd;
    ctx.beginPath(); ctx.arc(c.x, c.y, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(120,70,10,0.6)'; ctx.lineWidth = 1;
    ctx.stroke();
    // 数额标签
    if (c.val > 0) {
      ctx.fillStyle = '#ffe08a';
      ctx.font = 'bold 14px "PingFang SC",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('+' + c.val, c.x, c.y - 14);
    }
    ctx.restore();
  }
}

function saveAch() { try { localStorage.setItem(ACH_KEY, JSON.stringify(achUnlocked)); } catch (e) {} }

// 检查是否有新解锁的成就（返回新解锁的成就列表）
// 奖励模式：合并瞬间解锁的成就先记在"待结算金币"里，局末统一发（避免打乱"分数→金币"节奏）；
// 局末结算时的成就直接发。
let _pendingAchCoins = 0;
function checkAchievements(payNow) {
  const newly = [];
  for (const a of ACHIEVEMENTS) {
    if (achUnlocked[a.id]) continue;
    if (a.check(stats)) {
      achUnlocked[a.id] = { at: Date.now() };
      newly.push(a);
    }
  }
  if (newly.length) {
    saveAch();
    let totalReward = 0;
    for (const a of newly) totalReward += a.reward;
    if (totalReward > 0) {
      if (payNow) earnCoins(totalReward);
      else _pendingAchCoins += totalReward;
    }
    for (const a of newly) {
      queueAchToast(a);
      if (typeof track === 'function') track('ach_unlock', { id: a.id, reward: a.reward });
    }
  }
  return newly;
}

// 成就 Toast 队列（1.6s/个，屏幕右上滑入）
const _achToastQueue = [];
let _achToastActive = null;
function queueAchToast(a) {
  _achToastQueue.push({ a, life: 2.2, maxLife: 2.2, tIn: 0.35 });
}

function updateAchToast(dt) {
  if (!_achToastActive && _achToastQueue.length) {
    _achToastActive = _achToastQueue.shift();
  }
  if (_achToastActive) {
    _achToastActive.life -= dt;
    if (_achToastActive.life <= 0) _achToastActive = null;
  }
}

function drawAchToast() {
  if (!_achToastActive) return;
  const t = _achToastActive;
  const p = 1 - t.life / t.maxLife;
  const slideIn = p < 0.12 ? p / 0.12 : 1;
  const fadeOut = p > 0.85 ? Math.max(0, 1 - (p - 0.85) / 0.15) : 1;
  const alpha = slideIn * fadeOut;
  ctx.save();
  ctx.globalAlpha = alpha;
  const w = 240, h = 62;
  const x = W - w - 12, y = 60 + (1 - slideIn) * 20;
  // 卡片背景
  ctx.fillStyle = 'rgba(20,20,30,0.86)';
  ctx.strokeStyle = '#ffd76a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  const r = 12;
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // 徽章图标（金色圆）
  const bx = x + 22, by = y + h / 2;
  const gd = ctx.createRadialGradient(bx - 4, by - 4, 2, bx, by, 18);
  gd.addColorStop(0, '#fff6c9'); gd.addColorStop(0.7, '#ffd54a'); gd.addColorStop(1, '#c98a1a');
  ctx.fillStyle = gd;
  ctx.beginPath(); ctx.arc(bx, by, 16, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#7a4a10'; ctx.font = 'bold 18px "PingFang SC",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('★', bx, by + 1);
  // 文字
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffe08a'; ctx.font = 'bold 13px "PingFang SC",sans-serif';
  ctx.fillText(I18N.t('ach_unlocked'), x + 46, y + 22);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 15px "PingFang SC",sans-serif';
  const title = I18N.lang === 'en' ? t.a.en : t.a.zh;
  ctx.fillText(title + '  +' + t.a.reward + '💰', x + 46, y + 44);
  ctx.restore();
}

// 排行榜写入
function pushLeaderboard(entry) {
  leaderboard.push({
    score: entry.score | 0,
    merges: entry.merges | 0,
    peak: entry.peak | 0,
    ts: Date.now(),
  });
  leaderboard.sort((a, b) => b.score - a.score);
  leaderboard = leaderboard.slice(0, 10);
  saveLB();
}

// 局末统计钩子：在 gameOverNow 之后调用
function onGameOverStats(finalScore, finalMerges, peak, usedItem) {
  stats.totalRuns++;
  stats.totalMerges += finalMerges;
  if (peak > stats.peakLevel) stats.peakLevel = peak;
  if (finalScore > stats.bestScore) stats.bestScore = finalScore;
  if (!usedItem && finalScore > stats.noItemBest) stats.noItemBest = finalScore;
  saveStats();
  pushLeaderboard({ score: finalScore, merges: finalMerges, peak: peak });
  checkAchievements(true);   // 结算时直接发奖
  // 把局内累计的成就奖一次性发出
  if (_pendingAchCoins > 0) {
    earnCoins(_pendingAchCoins);
    _pendingAchCoins = 0;
  }
}

// combo 记录钩子（每次 doMerge 时会给 cmb，最大 cmb 记录到 stats）
const _origOnMergeJuice = onMergeJuice;
onMergeJuice = function (nx, ny, level, cmb, gain, isJackpot) {
  _origOnMergeJuice(nx, ny, level, cmb, gain, isJackpot);
  if (cmb > stats.peakCombo) { stats.peakCombo = cmb; saveStats(); }
  checkAchievements();
};

}

// 包 gameOverNow：加统计与成就
const _origGameOverNow = gameOverNow;
gameOverNow = function () {
  const scoreBefore = score;
  const mergesBefore = merges;
  let peak = 0;
  for (let i = 1; i <= 11; i++) if (seenLevels[i]) peak = i;
  for (const b of balls) if (b.level > peak) peak = b.level;
  _origGameOverNow();
  onGameOverStats(scoreBefore, mergesBefore, peak, _usedItemThisRun);
};

// 分享钩子：记录分享次数
if (typeof doShare === 'function') {
  const _origDoShare = doShare;
  doShare = function () {
    const r = _origDoShare();
    // r 可能是 Promise 或同步返回。同步部分先记数，异步则挂 then。
    const bump = () => { stats.shareCount++; saveStats(); checkAchievements(); };
    if (r && typeof r.then === 'function') { r.then(bump, () => {}); }
    else { bump(); }
    return r;
  };
}

if (typeof shareGame === 'function') {
  const _origShareGame = shareGame;

    const bump = () => { stats.shareCount++; saveStats(); checkAchievements(); };
    if (r && typeof r.then === 'function') { r.then(bump, () => {}); }
    else { bump(); }
    return r;
  };
}

      if (s && s.streak && s.streak > stats.signinStreak) { stats.signinStreak = s.streak; saveStats(); }

    checkAchievements();
    return r;
  };
}

// ---- 反作弊签名 ----
// 简单 HMAC-like：sha1-ish 混合（纯 JS，抵御 devtools 手改 localStorage）
function _sig(payload) {
  const key = 'sK-2026-mo';
  let h1 = 0, h2 = 0;
  const s = key + '|' + payload + '|' + key;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 = ((h1 << 5) - h1 + c) | 0;
    h2 = ((h2 * 31) ^ c) | 0;
  }
  return (h1 >>> 0).toString(36) + '-' + (h2 >>> 0).toString(36);
}

function signedSet(key, val) {
  try {
    const payload = JSON.stringify(val);
    localStorage.setItem(key, payload);
    localStorage.setItem(key + '_sig', _sig(payload));
  } catch (e) {}
}
function signedGet(key, defVal) {
  try {
    const raw = localStorage.getItem(key);
    if (raw == null) return defVal;
    const sig = localStorage.getItem(key + '_sig');
    if (sig !== _sig(raw)) {
      // 签名不匹配 → 复位（防外部手改）
      localStorage.removeItem(key);
      localStorage.removeItem(key + '_sig');
      if (typeof track === 'function') track('cheat_detected', { key: key });
      return defVal;
    }
    return JSON.parse(raw);
  } catch (e) { return defVal; }
}

(function migrateSigs() {
  const keys = ['suikaBest', STORE_KEY_COINS, STATS_KEY, LB_KEY, ACH_KEY];

})();

  daily: {
    open: openSheet, close: closeSheet,
    sheet: () => ({ open: sheetOpen, kind: sheetKind, title: sheetTitleEl.textContent, html: sheetBodyEl.innerHTML }),
    dayNum: () => dayNum(),
    checkin: doCheckin,
    double: doubleCheckin,
    autoShow: () => maybeAutoCheckin(),
    ci: () => ({ last: dailyState.last, streak: dailyState.streak, doubled: dailyState.doubled,
                 slot: checkinSlot(), claimedToday: checkinClaimedToday(), canDouble: canDoubleCheckin() }),
    // 测试用：把「上次签到」挪到 n 天前，模拟连签 / 断签
    setLast: (daysAgo, streak) => { dailyState.last = dayNum() - daysAgo; dailyState.streak = streak | 0; dailyState.doubled = false; saveDaily(); updateMenuDots(); return dailyState.last; },
    quests: () => ({ day: questState.day, bonus: questState.bonus,
                     q: questState.q.map(r => { const d = questDef(r.id); return { id: r.id, type: d.type, need: d.need, reward: d.reward, prog: r.prog, done: questDone(r), claimed: r.claimed }; }),
                     claimable: questClaimable(), bonusReady: questBonusReady() }),
    bump: questBump, peak: questPeak,
    claim: questClaim, bonus: questClaimBonus,
    setQuests: ids => { questState = { day: dayNum(), q: ids.map(id => ({ id: id, prog: 0, claimed: false })), bonus: false }; questSave(); return questState.q.map(r => r.id); },
    rollDay: () => { questState.day = -1; questRollDay(); return questState.q.map(r => r.id); },
    skins: () => ({ cur: skinState.cur, owned: skinState.owned.slice(),
                    fruits: FRUITS.map(f => [f.emoji, f.color]),
                    all: SKINS.map(s => ({ id: s.id, cost: s.cost, own: ownSkin(s.id) })) }),
    buySkin: buySkin, equipSkin: equipSkin, grantSkin: grantSkin,
    dots: () => { updateMenuDots(); const n = document.querySelectorAll('[data-menu]'); const o = {}; for (let i = 0; i < n.length; i++) o[n[i].getAttribute('data-menu')] = n[i].classList.contains('dot'); return o; },
  },
  // ---- 阶段J 传播 / 埋点 / 引导钩子 ----
  viral: {
    // 埋点
    tm: () => ({ endpoint: TELEMETRY.endpoint, uid: TM_UID, sid: TM_SID,
                 queued: tmQueue.length, sent: tmSent, flushes: tmFlushes, dropped: tmDropped,
                 last: tmLastPayload }),
    tmConfig: TELEMETRY,
    flush: r => tmFlush(r || 'test'),
    events: () => (window.__events || []).slice(),
    evNames: () => (window.__events || []).map(e => e.ev),
    clearEvents: () => { window.__events = []; },
    // 分享卡片
    card: () => { const c = drawShareCard(); return c ? { w: c.width, h: c.height } : null; },
    cardEl: () => drawShareCard(),
    open: openShare, close: closeShare,
    state: () => ({ open: shareOpen, day: shareState.day, count: shareState.count, total: shareState.total,
                    rewardReady: shareRewardReady(), text: shareText(), link: inviteLink(),
                    btnShown: btnShareEl ? btnShareEl.style.display !== 'none' : false,
                    btnLabel: btnShareEl ? btnShareEl.textContent : '',
                    reward: shareRewardEl ? shareRewardEl.textContent : '' }),
    share: doShare, copy: doCopyLink, save: doSaveCard,
    settle: ch => shareSettle(ch || 'test'),
    rollDay: () => { shareState.day = ''; saveShare(); shareRollDay(); return shareState.count; },
    // 裂变
    ref: () => ({ from: refState.from, claimed: refState.claimed, code: myRefCode(), link: inviteLink() }),
    claimRef: () => referralInit(),
    resetRef: () => { refState = { from: '', claimed: false, sent: 0 }; saveRef(); },
    // 新手引导
    tut: () => ({ step: tutStep, done: tutDone, drops: tutDrops,
                  shown: tutEl ? tutEl.classList.contains('on') : false,
                  html: tutEl ? tutEl.innerHTML : '' }),
    tutStart: tutStart,
    tutReset: () => { tutDone = false; tutStep = 0; tutDrops = 0; try { localStorage.removeItem('suikaTut'); } catch (e) {} tutRender(); },
  },
  // ---- 阶段K 手感钩子 ----
  juice: {
    state: () => ({
      badge: KJ.badge ? { count: KJ.badge.count, life: KJ.badge.life, maxLife: KJ.badge.maxLife } : null,
      flies: KJ.coinFlies.length,
      flyVal: KJ.coinFlies.reduce((s, c) => s + c.val, 0),
      hudPulse: KJ.hudPulse, coinPulse: KJ.coinPulse,
      slowmo: slowmo, shake: shake, flash: flash, hitstop: hitstop,
    }),
    trigger: (nx, ny, level, cmb, gain, jack) => onMergeJuice(nx || W/2, ny || 200, level | 0, cmb | 0, gain | 0, !!jack),
    fly: (x, y, n) => { spawnCoinFly(x || W/2, y || 200, n | 0); return KJ.coinFlies.length; },
    scorePulse: () => { KJ.hudPulse = 1; applyHudPulse(); return scoreEl.classList.contains('pulse'); },
    coinPulse: () => { KJ.coinPulse = 1; applyHudPulse(); return coinCountEl.classList.contains('pulse'); },
    reset: () => { KJ.badge = null; KJ.coinFlies.length = 0; KJ.hudPulse = 0; KJ.coinPulse = 0; },
  },
  // ---- 阶段L 成就 / 排行榜 ----
  ach: {
    state: () => ({
      unlocked: Object.keys(achUnlocked).slice(),
      count: Object.keys(achUnlocked).length,
      total: ACHIEVEMENTS.length,
      stats: Object.assign({}, stats),
      lb: leaderboard.slice(),
      toastActive: _achToastActive ? { id: _achToastActive.a.id, life: _achToastActive.life } : null,
      queueLen: _achToastQueue.length,
      // 已发放的成就奖励总金币（用于测试从金币里扣除）
      bonusPaid: (function () {
        let s = 0;
        for (const a of ACHIEVEMENTS) if (achUnlocked[a.id]) s += a.reward;
        return s;
      })(),
    }),
    reset: () => {
      achUnlocked = {}; saveAch();
      stats = { totalMerges: 0, totalRuns: 0, peakLevel: 0, peakCombo: 0, bestScore: 0, shareCount: 0, signinStreak: 0, noItemBest: 0 };
      saveStats();
      leaderboard = []; saveLB();
      _achToastQueue.length = 0; _achToastActive = null;
    },
    forceStats: patch => { Object.assign(stats, patch || {}); saveStats(); return Object.assign({}, stats); },
    check: () => checkAchievements().map(a => a.id),
    open: openAchLB,
    close: closeAchLB,
    panel: () => {
      const p = document.getElementById('achLBPanel');
      return { open: !!(p && p.style.display === 'flex'), html: p ? p.innerHTML.length : 0 };
    },
    achList: () => ACHIEVEMENTS.map(a => ({ id: a.id, zh: a.zh, en: a.en, reward: a.reward, unlocked: !!achUnlocked[a.id] })),
  },
  // ---- 阶段M 多语言 / 反作弊 ----
  i18n: {
    lang: () => I18N.lang,
    t: k => I18N.t(k),
    set: l => I18N.setLang(l),
    toggle: () => I18N.toggle(),
    apply: () => applyI18n(),
    dict: () => I18N.dict,
  },
  security: {
    sign: p => _sig(p),
    verify: (p, s) => _sig(p) === s,
    setSignedBest: v => { try { localStorage.setItem('suikaBest', String(v)); localStorage.setItem('suikaBest_sig', _sig(String(v))); best = v; } catch (e) {} },
    tamperBest: v => { try { localStorage.setItem('suikaBest', String(v)); } catch (e) {} }, // 只改值不改签名
    checkCoins: () => {
      const raw = localStorage.getItem(STORE_KEY_COINS);
      const sig = localStorage.getItem(STORE_KEY_COINS + '_sig');
      return { raw: raw, sig: sig, valid: sig === _sig(raw || '') };
    },
    signedSet: signedSet,
    signedGet: signedGet,
  },
  // ---- 阶段N 离线召回 ----
  recall: {
    setLastPlay: d => { try { localStorage.setItem('suikaLastPlay', d); } catch (e) {} },
    getLastPlay: () => { try { return localStorage.getItem('suikaLastPlay'); } catch (e) { return null; } },
    trigger: () => offlineRecallBanner(),
    hint: () => { const h = document.getElementById('recallHint'); return h ? h.textContent : null; },
  },
};
</script>

  <div class="ad-slot" data-ad-slot="bannerBottom"></div>
  <script src="../config.js"></script>
  <script src="../ads.js"></script>
<script>
/* Web 版启动器：立即执行游戏主脚本，存档走 localStorage */
FBStore.boot(function () {
  var s = document.createElement('script');
  s.textContent = document.getElementById('game-src').textContent;
  document.body.appendChild(s);
  /* 最高分 → Instant Games 排行榜 watermelon_score（在游戏自己的签名包装之后再包一层） */
  var hook = document.createElement('script');
  hook.textContent = "(function () { if (typeof gameOverNow === 'function') { var _orig = gameOverNow; gameOverNow = function () { _orig(); try { FBStore.submitScore('watermelon_score', best); } catch (e) {} }; } })();";
  document.body.appendChild(hook);
});
</script>

<script>
/* Web 版扩展：游戏结束插屏位（占位）。在启动器已包装好的 gameOverNow
   之外再包一层，未在 config.js 配置广告代码时为空操作，不影响游戏。 */
(function () {
  if (typeof gameOverNow === 'function') {
    var _prev = gameOverNow;
    gameOverNow = function () {
      _prev();
      if (window.Ads) Ads.interstitial('suika-gameover');
    };
  }
})();
</script>
